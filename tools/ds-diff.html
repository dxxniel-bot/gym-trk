<!doctype html><html><head><meta charset="utf-8"><title>ds-diff</title>
<style>body{margin:0;background:#111;display:flex;gap:8px} iframe{width:393px;height:852px;border:0;background:#000}</style></head>
<body><iframe id="A"></iframe><iframe id="B"></iframe>
<script>
// D21: cada carga rompe la caché (?cb=hora) — sin esto el navegador podía servir un _pre.html o index.html viejo y el diff
// comparaba versiones equivocadas. ?a=… / ?b=… eligen otros archivos (p. ej. ?a=../_v241.html para re-verificar una fase).
// v259 · herramienta de desarrollo: solo en localhost, y cada frame corre detrás del guardia del estudio
// (tools/studio/guard.js): antes el escenario live:workout creaba una sesión DE VERDAD en el almacenamiento.
if(!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){ document.body.innerHTML='<p style="color:#f55;font:12px monospace;padding:16px">ds-diff solo corre en localhost</p>'; throw new Error('ds-diff: solo localhost'); }
const _q=new URLSearchParams(location.search), _cb='?cb='+Date.now(), SRC={A:(_q.get('a')||'../_pre.html'),B:(_q.get('b')||'../index.html')}, _sz={};
async function guarded(id,src){ const base=new URL('../',location.href).href, f=document.getElementById(id); f._trkCfg={};
  let t=await fetch(new URL(src+_cb,location.href).href,{cache:'no-store'}).then(r=>r.text()); _sz[id]=t.length;
  let nH=0,nS=0; t=t.replace(/<head([^>]*)>/i,m=>(nH++,m+'<base href="'+base+'"><script src="tools/studio/guard.js'+_cb+'"><\/script>'))
   .replace(/<script>\s*"use strict";/,()=>(nS++,'<script>"use strict";if(!(window.__trk&&window.__trk.sandbox===true))throw new Error("TRK: sin guardia");'));   // sin guardia, la app no arranca
  if(nH!==1||nS!==1)throw new Error('ds-diff: no se pudo poner el guardia en '+src); f.srcdoc=t; }
guarded('A',SRC.A); guarded('B',SRC.B);
function loaded(){ return Object.fromEntries(['A','B'].map(k=>[k,SRC[k]+' · '+(_sz[k]||'?')+' caracteres · guardia '+(((document.getElementById(k).contentWindow||{}).__trk||{}).mode||'NO')])); }
// gym//TRK · diff de estilos computados (DESIGN_SYSTEM.md §18). Copia la versión anterior a repo/_pre.html (no se versiona),
// sirve repo/ y abre /tools/ds-diff.html; en consola: go2() y luego report(). Mismo escenario en A (antes) y B (ahora), elemento por elemento.
const P=['color','fontSize','fontWeight','marginTop','marginBottom','marginLeft','marginRight','paddingTop','paddingBottom','paddingLeft','paddingRight','textAlign','cursor','flexGrow','flexShrink','flexBasis','minWidth','whiteSpace','textDecorationLine','cssFloat','verticalAlign','display','flexWrap','alignItems','justifyContent','columnGap','rowGap','flexDirection','fontStyle','letterSpacing','width','height',
  // v260 (tokens exactos): lo que la tokenización de líneas, interlineado, radios, opacidad y trazos no puede mover
  'lineHeight','borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth','borderTopColor','borderBottomColor','borderTopLeftRadius','borderTopRightRadius','borderBottomRightRadius','borderBottomLeftRadius','opacity','boxShadow','filter','strokeWidth','backdropFilter','outlineWidth','transitionDuration','animationName'];
function snap(W){ W.document.getAnimations().forEach(a=>{ try{a.finish();}catch(_){} }); const out=[];
  const walk=(el,path)=>{ const cs=W.getComputedStyle(el); out.push({path,cls:el.getAttribute('class')||'',v:P.map(p=>cs[p])}); [...el.children].forEach((c,i)=>walk(c,path+'/'+c.tagName.toLowerCase()+i)); };
  ['view','modal','nowbar','resttimer','wfooter','nav','toasts','asklayer'].forEach(id=>{ const el=W.document.getElementById(id); if(el)walk(el,'#'+id); });
  return out; }
const food={name:'x',base:'g',per100:{kcal:100,protein:10,carbs:10,fat:2},sizes:{serving:30}};
const lastS=D=>D.sessions[D.sessions.length-1];
const S2=[
['home',W=>W.go('home')],
// v272 · //STIMULUS en σ: home con #view desplazado hasta la sección (el snap no ve el scroll: mismo DOM que home, va por
// paridad con los ids del estudio) · m:deload: la hoja de fatiga acumulada (en un _pre.html anterior a v272 no existe: ERR en A)
['home:stimulus',W=>{ W.go('home'); const v=W.document.getElementById('view'), e=W.document.querySelector('#view [data-gloss="stim"]'); if(v&&e)v.scrollTop+=e.getBoundingClientRect().top-v.getBoundingClientRect().top; }],
['workout',W=>W.go('workout')],['macros',W=>W.go('macros')],['progress',W=>W.go('progress')],['history',W=>W.go('history')],['settings',W=>W.go('settings')],['splitedit',W=>W.go('splitedit')],['stack',W=>W.go('stack')],
// v271 · macros con el detalle abierto (macros:open del estudio) y el toque real de [ver %]; sale siempre de gramos → %.
// Deja macroOpen y macroPct encendidos para lo que sigue (igual en A y B)
['macros:unit',W=>{ const S=W.__trk.state; S.macroPct=false; S.macroOpen=false; W.go('macros'); const t=W.document.querySelector('#view [data-act="togglemacros"]'); if(t)t.click(); else { S.macroOpen=true; W.render(); } const u=W.document.querySelector('#view [data-act="toggleMacroUnit"]'); if(u)u.click(); }],
['landing',W=>W.go('landing')],['login',W=>W.go('login')],['onboard',W=>W.go('onboard')],
['m:metric',W=>{W.go('progress');W.openMetricDetail('steps')}],['m:muscle',W=>W.openMuscleDetail('side_delts')],['m:catalog',W=>W.openExerciseDirectory()],['m:session',(W,D)=>W.openSessionEdit(lastS(D).id)],
['m:ready',W=>W.openReadiness(W.todayISO())],['m:food',W=>W.openFoodAdd()],['m:goals',W=>W.openGoals()],['m:sleep',W=>W.openSleepLog()],['m:weight',W=>W.openWeightLog()],['m:rhr',W=>W.openHealthNumLog('rhr')],
['m:profile',(W,D)=>W.openExProfile(D.split.days[0].exercises[0].name)],['m:musclemap',W=>W.openMuscleMap()],['m:exedit',W=>{W.go('splitedit');W.openExEdit(0,0)}],['m:stackedit',(W,D)=>W.openStackEdit((D.stack[0]||{}).id)],['m:stacknew',W=>W.openStackEdit(null)],
['m:merge',W=>W.openMergeModal()],['m:lift',(W,D)=>W.openLiftDetail(lastS(D).exercises[0].name)],['m:addex2',W=>{W.go('workout');W.openAddExStep2(0,'chest')}],['m:addexform',W=>{W.go('workout');W.openAddExForm(0,'chest')}],
['m:namesearch',W=>W.openNameSearch()],['m:machine',W=>{W.go('workout');W.openMachineEdit(0)}],['m:volume',W=>W.openVolumeDetail()],['m:deload',W=>{ W.go('home'); W.openDeloadInfo(); }],['m:workshop',W=>W.openWorkshop()],['m:approx',W=>W.openApproxMeal()],['m:progcfg',W=>{W.go('progress');W.openProgConfig()}],
['m:adhoc',W=>W.openAdhocLog()],['m:import',W=>W.openImportSplit()],['m:gympick',W=>W.openGymPicker()],['m:sched',W=>W.openScheduleModal(0)],['m:drink',W=>W.openDrink()],['m:text',W=>W.openTextParse()],['m:health',W=>W.openHealthImport()],['m:mealcode',W=>W.openMealCode()],
['m:verify',W=>W.openVerify(food,{})],['m:log',(W,D)=>W.openLog((D.foods||[])[0]||food,{isNew:true})],
// v271 · alimento guardado: sin fila "guardar en mis alimentos" y [cancel] que cierra (ya no loguea)
['m:log:saved',(W,D)=>{ const f=(D.foods||[])[0]||food; W._faCtx=null; W.openLog(f,{fromId:f.id||null,tag:'meal'}); }],['m:lognutri',(W,D)=>W.openLog(food,{isNew:true})],['m:navmenu',W=>{ const u=W.document.querySelector('[data-act="navmenu"]'); if(u)u.click(); }],
['m:mealsum',(W,D)=>{ W.go('macros'); const d=Object.keys(D.meals||{}).sort().pop(); const t=((D.meals||{})[d]||[])[0]; if(t)W.openMealSummary(t.tag); }],
['m:shareday',W=>{ W.go('macros'); const s=W.document.querySelector('[data-act="share"],[data-act="sharemacros"]'); if(s)s.click(); }],
['m:histrow',W=>{ W.go('history'); const r=W.document.querySelector('.hrow'); if(r)r.click(); const b=W.document.querySelector('.hbody [data-act="vieweditsession"]'); if(b)b.click(); }],
['share:session',(W,D)=>{ W.openSessionEdit(lastS(D).id); const b=W.document.querySelector('[data-act="sharesession"]'); if(b)b.click(); }],
['hist:open',W=>{ W.go('history'); const r=W.document.querySelector('.hitem .hrow'); if(r)r.click(); }],
// sesión en curso: toca "start" en gym (si ya hay una, la retoma) y se queda en la tabla; después, sus sheets
['live:workout',W=>{ W.go('home'); const b=W.document.querySelector('[data-act="start"],[data-act="resume"]'); if(b)b.click(); W.go('workout'); }],
['live:exedit',W=>{ W.go('workout'); W.openExEdit(0,0,0); }],
['live:machine',W=>{ W.go('workout'); W.openMachineEdit(0); }],
// v274 · progreso por ejercicio (en un _pre.html anterior a v274 openExHist no existe: ERR en A). Solo estado de pantalla
// (_exFrom/_exKey/_exTab/_exDays/_exAll), nada de la db. //EXERCISES en progreso, la bitácora del ejercicio con más
// sesiones (clave exHistKey, nunca exId), su //LOG, la pestaña peso top con todo el periodo, y en la sesión en curso el
// toque en el nombre → trkMenu [historial] [cambiar ejercicio] (la capa de TRKAsk se cierra al empezar el siguiente)
['progress:exercises',W=>{ exReset(W); W.go('progress'); secTop(W,[...W.document.querySelectorAll('#view .grp-label')].find(e=>/^\/\/EXERCISES\b/.test(e.textContent.trim()))); }],
['exhist',W=>exOpen(W)],
['exhist:log',W=>{ exOpen(W); secTop(W,[...W.document.querySelectorAll('#view .section')].find(s=>/^\/\/\s*LOG\b/.test(((s.querySelector('.h')||s).textContent||'').trim()))); }],
['exhist:top',W=>{ exOpen(W); const t=W.document.querySelector('#view [data-act="extab"][data-t="top"]'); if(t)t.click(); const r=W.document.querySelector('#view [data-act="exrange"][data-r="9999"]'); if(r)r.click(); }],
['workout:exname',W=>{ W.go('workout'); const w=W.__trk.db.activeWork, xs=(w&&w.exercises)||[]; let i=xs.findIndex(e=>e&&!W.isCardio(e)&&W.exHistRows(W.exHistKey(e)).length); if(i<0)i=0; const n=W.document.querySelector('#view [data-act="editexname"][data-exi="'+i+'"]'); if(n)n.click(); }],
// v273 · cómo entrenas. Van AL FINAL porque cambian la db del frame (plan, métrica, lo de hoy apartado) y aquí no hay
// later(): lo que sigue lo heredaría. En un _pre.html anterior a v273 el plan y la métrica no existen (A pinta lo de antes)
['splitedit:schedule',W=>{ W.go('splitedit'); schedTop(W); }],
['splitedit:weekly',(W,D)=>{ const P=W.splitPlan?W.splitPlan():{blocked:[]}; D.split.plan={mode:'weekly',on:P.on,off:P.off,week:{},blocked:P.blocked.slice()}; if(W.defaultWeek)D.split.plan.week=W.defaultWeek(); W.__trk.state.selDay=null; W.go('splitedit'); schedTop(W); }],
['home:planrest',(W,D)=>planRest(W,D)],
// la sesión congela su escala al nacer: se reemplaza la del frame (en memoria, detrás del guardia) y se abre el RPE de la 1.ª serie
['workout:rpe',(W,D)=>{ D.split.metric='rpe'; D.activeWork=W.newWorkSession(); W.__trk.state._curEx=null; W.go('workout'); const b=W.document.querySelector('#view .rirb'); if(b)b.click(); }]
];
// v274 · #view hasta una sección (su regla arriba), como toSection del estudio; el ejercicio con más sesiones; la bitácora
// abierta desde progreso con su estado por defecto (e1RM · 6M · solo los recientes)
function secTop(W,el){ const v=W.document.getElementById('view'); if(!v||!el)return; const sec=el.closest('.section')||el, hr=sec.previousElementSibling, top=(hr&&hr.classList.contains('rule'))?hr:sec; v.scrollTop+=top.getBoundingClientRect().top-v.getBoundingClientRect().top; }
function topExKey(W){ const c={}; let best=null; W.exIndex().forEach(r=>{ if(!r||!r.ex||W.isCardio(r.ex))return; const k=W.exHistKey(r.ex); if(!k)return; c[k]=(c[k]||0)+1; if(!best||c[k]>c[best])best=k; }); return best; }
function exReset(W){ const S=W.__trk.state; ['_exFrom','_exKey','_exTab','_exDays','_exAll'].forEach(k=>{ delete S[k]; }); }
function exOpen(W){ exReset(W); W.go('progress'); W.openExHist(topExKey(W)); }
// v273 · #view hasta //SCHEDULE (la cabecera justo antes de la fila `modo`), como toSection del estudio
function schedTop(W){ const v=W.document.getElementById('view'), b=W.document.querySelector('#view [data-act="sp_mode"]'), ln=b&&b.closest('.line'), sec=ln&&ln.previousElementSibling; if(!v||!sec)return;
  const hr=sec.previousElementSibling, top=(hr&&hr.classList.contains('rule'))?hr:sec; v.scrollTop+=top.getBoundingClientRect().top-v.getBoundingClientRect().top; }
// v273 · hoy toca descanso por el plan: fuera la sesión viva, lo de hoy (entreno y descanso) y un plan rotativo que con esta
// historia dé descanso hoy (mismo orden que planRest del estudio); si ninguno, hoy sin gym
function planRest(W,D){ const t=W.todayISO(); D.activeWork=null; D.sessions=(D.sessions||[]).filter(s=>!(s&&s.date===t)); try{ W.bumpIdx(); }catch(_){} W.__trk.state.selDay=null;
  if(W.planDay&&W.splitPlan&&(D.split.days||[]).length){ const P0=W.splitPlan(), dw=W.dowOf(t), bl=P0.blocked.filter(d=>d!==dw); let ok=false;
    for(const [on,off] of (P0.mode==='cycle'?[[P0.on,P0.off]]:[]).concat([[3,1],[2,1],[1,1],[1,2],[2,2],[3,2],[1,3],[2,3],[3,3]])){ D.split.plan={mode:'cycle',on,off,blocked:bl.slice()}; const pd=W.planDay(t); if(pd.rest&&pd.why==='plan'){ ok=true; break; } }
    if(!ok)D.split.plan={mode:'cycle',on:P0.on,off:P0.off,blocked:bl.concat([dw])}; }
  W.go('home'); }
async function runDiff2(S){ const A=document.getElementById('A').contentWindow, B=document.getElementById('B').contentWindow; const res={};
  if(!A.__trk||!B.__trk)throw new Error('frames sin guardia: no se corre');
  const D=W=>W.__trk.db;
  for(const [name,fn] of S){ let ea='',eb='';
    try{ try{A.closeModal()}catch(_){} try{A.closeAsk(true)}catch(_){} fn(A,D(A)); }catch(e){ ea=e.message; }   // v274 · también la capa de TRKAsk (workout:exname deja un trkMenu)
    try{ try{B.closeModal()}catch(_){} try{B.closeAsk(true)}catch(_){} fn(B,D(B)); }catch(e){ eb=e.message; }
    await new Promise(r=>setTimeout(r,40));
    const a=snap(A), b=snap(B); const diffs=[];
    if(a.length!==b.length){ res[name]={err:ea||eb||null, struct:'A '+a.length+' vs B '+b.length}; continue; }
    a.forEach((x,i)=>{ const y=b[i]; x.v.forEach((v,j)=>{ if(v!==y.v[j])diffs.push(x.path+' ['+y.cls+'] '+P[j]+': '+v+' → '+y.v[j]); }); });
    res[name]={n:a.length, err:ea||eb||null, diffs:diffs.slice(0, +_q.get('n')||10), nd:diffs.length}; }   // v264 · ?n=… sube el tope para agregar el diff completo
  return res; }
function go2(){ window._R2=null; window._t0=Date.now(); runDiff2(S2).then(r=>{ window._R2=r; window._t1=Date.now(); }).catch(e=>{ window._R2={fatal:e.message}; }); return 'started '+S2.length; }
function report(){ const r=window._R2; if(!r)return 'running'; if(r.fatal)return r.fatal; return JSON.stringify({loaded:loaded(),ok:Object.entries(r).filter(([k,v])=>!v.struct&&!v.nd).map(([k,v])=>k+'('+v.n+(v.err?' ERR '+v.err.slice(0,60):'')+')').join(' '), bad:Object.fromEntries(Object.entries(r).filter(([k,v])=>v.struct||v.nd))},null,1); }
</script></body></html>
