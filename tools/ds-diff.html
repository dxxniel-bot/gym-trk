// frasco en el primer activo diario, o un omega-3 de muestra) y uno en pausa y uno archivado de muestra si faltan
function suppSeed(W,D){ const st=D.stack||(D.stack=[]), t=W.todayISO(), d=k=>W.shiftDate(t,-k), nm=n=>st.some(x=>String((x&&x.name)||'').toLowerCase().trim()===n)?n+' (muestra)':n;

      const p={id:'p_diff_low',brand:'Norda',name:'',form,per,size:per*30,dose:it.dose,unit:it.unit,added:d(20)}; it.products=(it.products||[]).concat([p]); it.cur=p.id; }
    const p=W.suppProd(it); if(!p.brand)p.brand='Norda'; let c=W.suppCont(it); if(!c||c.prod!==p.id){ c={id:'c_diff_low',prod:p.id,opened:d(20),size:+p.size||60}; it.containers=(it.containers||[]).concat([c]); }
    if(!(+c.size>0))c.size=60; c.adj=0; const L=W.suppLeft(it); if(L)c.adj=Math.round((5*L.per-L.left)*100)/100; }
  const dz=(s,name,o)=>{ if(!st.some(x=>W.suppStatus(x)===s))st.push(Object.assign({id:'st_diff_'+s,name:nm(name),category:'supp',periodization:{type:'daily'},notes:'',startDate:d(95),ticks:{},archived:true,status:s},o)); };
  dz('paused','magnesio',{dose:'200',unit:'mg',when:['PM'],statusLog:[{d:d(19),to:'paused',why:'pausa'}],products:[{id:'p_diff_pa',brand:'Kora',name:'',form:'cápsulas',per:2,size:120,dose:'200',unit:'mg',added:d(60)}],cur:'p_diff_pa',containers:[{id:'c_diff_pa',prod:'p_diff_pa',opened:d(60),size:120}]});
