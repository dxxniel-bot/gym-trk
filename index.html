<style>
  :root{
    --bg:#000; --frame:#000; --fg:#f3f3f4;
    --o70:rgba(243,243,244,.74); --o60:rgba(243,243,244,.66); --o50:rgba(243,243,244,.56); --o40:rgba(243,243,244,.5);
    --o35:rgba(243,243,244,.46); --o30:rgba(243,243,244,.4); --o20:rgba(243,243,244,.26);
    --o12:rgba(243,243,244,.1); --o10:rgba(243,243,244,.06);
    --faint:#3a3a3e; --line:rgba(243,243,244,.08); --track:#191920; --fill:#f3f3f4; --abort:rgba(190,110,110,.55);
    --card:#0d0d10; --card2:#16161c; --border:rgba(243,243,244,.09); --radius:16px; --sheet-bg:#0a0a0c;
    --good:#46c98b; --bad:#e5675c; --warn:#e3b34f; --info:#6aa6ff;
    --good-glow:rgba(70,201,139,.5); --bad-glow:rgba(229,103,92,.5);
    /* liquid glass (chrome flotante; neutro/acromático) + texto sobre --fill */
    --glass-bg:rgba(14,14,17,.55); --glass-bg-strong:rgba(14,14,17,.72); --glass-blur:18px; --glass-sat:1.7;
    --glass-edge:rgba(243,243,244,.14); --glass-edge-lo:rgba(243,243,244,.06); --glass-shadow:0 8px 30px rgba(0,0,0,.55); --glass-ring:rgba(243,243,244,.1);
    --on-fill:#000;
    /* radius system: pill / control / card / sheet (controls=12 unifica botones+inputs) */
    --r-ctl:12px; --r-pill:999px; --r-sm:2px;
    /* page-rhythm knobs (ajustables en vivo con ?design) */
    --sp-py:22px; --sp-px:18px; --sp-card:15px; --sp-gap:12px; --sp-section:14px; --sp-field:12px; --sp-row:12px; --sp-sheet:18px; --r-sheet:22px;
    /* spacing scale (grid 4px; para spacings de componente) */
    --s1:2px; --s2:4px; --s3:8px; --s4:12px; --s5:16px; --s6:24px;
    /* type scale (una sola escala) — display 22 · section 16 · body 13 · sm 12 · meta 11 · xs 10 · caption 9 */
    --t-display:22px; --t-section:16px; --t-body:13px; --t-sm:12px; --t-meta:11px; --t-xs:10px; --t-caption:9px;
    /* DESIGN_SYSTEM.md (DS-1): hero, tracking por rol, escala 4px completa, marca de gráfica, sombra flotante,
       movimiento y capas. Ningún valor literal si existe su token. */
    --t-hero:34px;
    --ls-caps:.2em; --ls-title:.12em; --ls-num:-.03em; --ls-ui:.03em;
    --s7:32px; --s8:48px;
    --r-mark:4px;
    --shadow-float:0 6px 22px rgba(0,0,0,.55);
    --dur-1:120ms; --dur-2:180ms; --dur-3:280ms; --dur-screen:140ms; --toast-life:2.3s; --toast-life-err:4.6s;
    --ease-out:cubic-bezier(.22,1,.36,1); --ease-in:cubic-bezier(.4,0,1,1);
    --z-float:20; --z-nav:30; --z-modal:40; --z-pop:50; --z-overlay:60; --z-toast:80; --z-dev:90;
  }
  *{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  :focus{outline:none;}
  :focus-visible{outline:1.5px solid var(--fg); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms!important; animation-duration:.01ms!important; scroll-behavior:auto!important;} }
  html{height:100%;}
  body{background:var(--bg); color:var(--fg);
    font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;
    position:fixed; inset:0; overflow:hidden; overscroll-behavior:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;}
  .frame{position:relative; width:393px; height:852px; max-width:100%; max-height:100%; background:var(--frame); overflow:hidden;
    border-radius:var(--r-sm); box-shadow:var(--shadow-float);
    display:flex; flex-direction:column;}
  /* on a real phone: frame fills the screen, no floating card */
  @media (max-width:440px){ body{display:block;} .frame{width:100%; height:100%; max-height:none; border-radius:0; box-shadow:none;} }
  input,select,textarea{font-size:var(--t-section); -webkit-user-select:text; user-select:text;}
  .scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; padding:var(--sp-py) var(--sp-px) calc(84px + env(safe-area-inset-bottom));}
  .scroll::-webkit-scrollbar{width:6px} .scroll::-webkit-scrollbar-thumb{background:var(--o10)}
  input,select,button{font-family:inherit;}

  /* status bar */
  .status{display:flex; justify-content:space-between; align-items:flex-start; font-size:var(--t-xs); color:var(--o50);}
  .status .uname{font-weight:800; font-size:var(--t-sm); color:var(--fg);}
  .status .back{display:inline-block; margin-top:var(--s2); font-size:var(--t-meta); color:var(--o60); border:1px solid var(--o20); padding:10px var(--s4); cursor:pointer; border-radius:var(--r-ctl);}
  .status .center{text-align:center; line-height:1.4;}
  .status .streak{font-size:var(--t-sm); font-weight:800; color:var(--o50);}
  .status b{color:var(--o60); font-weight:500;}

  .rule{border:0; border-top:1px solid var(--line); margin:var(--s5) 0;}

  /* rotation */
  .rot{display:flex; justify-content:space-between; align-items:center; margin:var(--s4) 0 10px;}
  .rot .lbl{font-size:var(--t-xs); color:var(--o60); letter-spacing:var(--ls-caps);} .rot .n{font-size:var(--t-xs); color:var(--o40);}
  .segs{display:flex; gap:var(--s2); margin-bottom:var(--s4);} .segs i{flex:1; height:4px; background:var(--track); cursor:pointer;} .segs i.on{background:var(--fill);}
  .rot .arrow{cursor:pointer; color:var(--o60); padding:0 6px;}
  .ctrls{display:flex; gap:var(--s4); font-size:var(--t-xs); margin-bottom:var(--s6);} .ctrls a{color:var(--o50); cursor:pointer; padding:var(--s4) 6px; margin:calc(-1 * var(--s4)) -6px;}

  /* section header (stacked label + name) */
  .whdr{display:grid; grid-template-columns:auto 1fr; column-gap:var(--s3); row-gap:var(--s2); align-items:baseline; margin-bottom:var(--s3);}
  .whdr .l1,.whdr .l2{grid-column:1; justify-self:end; text-align:right; font-size:var(--t-section); font-weight:800; line-height:1; letter-spacing:var(--ls-title); color:var(--o50);}
  .whdr .l1{grid-row:1;} .whdr .l2{grid-row:2;} .whdr .l1 .s{color:var(--o50);}
  .whdr .wname{grid-column:2; grid-row:1; font-size:var(--t-display); font-weight:800; letter-spacing:var(--ls-num); line-height:1;}
  .whdr .wmeta{grid-column:2; grid-row:2; font-size:var(--t-caption); color:var(--o50); line-height:1; letter-spacing:var(--ls-ui);}
  .wgym{text-align:center; font-size:var(--t-xs); color:var(--o40); margin-top:var(--s3);}

  .section{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:var(--sp-section);}
  .section .h{font-size:var(--t-section); font-weight:800;} .section .h .s{color:var(--o50);}
  .section .meta{font-size:var(--t-meta); color:var(--o50); cursor:pointer; padding:6px var(--s2);}
  .section .meta[data-act]{border-radius:var(--r-ctl); padding:var(--s1) var(--s3);}   /* el borde usaba --o15 (no existe) y nunca se pintó; los [ ] ya dicen "acción" */

  /* CTA buttons */
  .cta{margin-top:var(--s5);}
  /* roles de botón (DESIGN_SYSTEM.md §7.1) — primario 48 · secundario 44 · ambos --r-ctl · zona táctil ≥44 */
  .start{display:block; width:100%; text-align:center; background:var(--fill); color:var(--on-fill); font-weight:700; font-size:var(--t-body); height:48px; padding:0; letter-spacing:var(--ls-ui); border:0; border-radius:var(--r-ctl); cursor:pointer;}
  .secondary{display:flex; gap:10px; margin-top:10px;}
  .secondary .b{flex:1; text-align:center; font-size:var(--t-sm); color:var(--fg); border:1px solid var(--border); height:44px; padding:0; background:transparent; cursor:pointer; letter-spacing:var(--ls-ui); border-radius:var(--r-ctl);}
  .secondary .b:active{background:var(--card2);}

  /* prev + stats lists */
  .line{display:flex; align-items:baseline; gap:10px; font-size:var(--t-meta); padding:var(--s2) 0;}
  .line .k{color:var(--o60);} .line .dots{flex:1; border-bottom:1px dotted var(--line); transform:translateY(-3px);} .line .v{color:var(--fg);}
  .line.stat .k{color:var(--o50);} .line.stat .v{font-weight:700;}
  .vrow{margin-bottom:var(--s4);} .vtop{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--t-meta);margin-bottom:6px;} .vm{color:var(--fg);} .vn{color:var(--o50);font-size:var(--t-xs);} .vd{color:var(--o40);}
  /* v228 · landmarks reales en //EFFECTIVE VOLUME + pantalla de músculos */
  .vbar .mrv{position:absolute;top:-1px;width:1px;height:5px;background:var(--warn);opacity:.7;}
  .vst{font-size:var(--t-caption); font-weight:400; color:var(--o40); margin-left:6px; letter-spacing:var(--ls-ui);} .vst.warn,.vst.high{color:var(--warn);} .vst.bad,.vst.over{color:var(--bad);} .vst.optimal{color:var(--fill);}
  .mmrow{display:flex; align-items:center; justify-content:space-between; gap:var(--s3); padding:6px 0; border-bottom:.5px solid var(--o10);}
  .mmrow .mml{font-size:var(--t-sm); flex:1; min-width:0;} .mmrow .mml i{font-style:normal; font-size:var(--t-caption); color:var(--o40); margin-left:var(--s2);}
  .mmrow select{flex:0 0 52%; max-width:52%; font-size:var(--t-body); height:44px; background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:var(--r-ctl); padding:0 var(--s4); -webkit-appearance:none; appearance:none;}
  .mmwarn{font-size:var(--t-caption); color:var(--warn); margin:calc(-1 * var(--s1)) 0 var(--s2);}
  .mmp{font-size:var(--t-caption); color:var(--o60); cursor:pointer; margin-left:6px; white-space:nowrap;}
  /* v230 · //MÚSCULOS */
  .mscrow{padding:var(--s3) 0 var(--s3); border-bottom:.5px solid var(--o10); cursor:pointer;} .mscrow:active{opacity:.7;}
  .msctop{display:flex; justify-content:space-between; align-items:baseline; gap:var(--s3); margin-bottom:6px;} .mscn{font-size:var(--t-sm); font-weight:700;} .mscv{font-size:var(--t-xs); color:var(--o50); white-space:nowrap;}
  .mscrec{font-size:var(--t-xs); margin-top:6px;}
  .mscd .mdline{align-items:baseline;} .mscd .mdv{white-space:normal; text-align:right;} .mscd .mdsub{display:inline-block;}
  /* v234 · diagnóstico por músculo: hallazgo (color = severidad) · evidencia · qué hacer. Sin puntuación. */
  .grp-label.sub{margin:var(--s4) 0 var(--s2);} .grp-label.first{margin:var(--s2) 0 var(--s2);}
  .dxrow{padding:6px 0; border-bottom:.5px solid var(--o10);}
  .dxh{font-size:var(--t-sm); font-weight:700;} .dxev{font-size:var(--t-xs); color:var(--o50); margin-top:var(--s1); line-height:1.4;} .dxdo{font-size:var(--t-xs); color:var(--o70); margin-top:var(--s1); line-height:1.4;}
  .dxnote{margin-top:6px;}
  .dx-bad{color:var(--bad);} .dx-warn{color:var(--warn);} .dx-info{color:var(--fg);} .dx-ok{color:var(--good);}
  .mscdx{font-size:var(--t-xs); margin-top:var(--s2);} .mscdx.dx-info{color:var(--o70);} .dxmore{color:var(--o40);}
  /* v229 · perfil del ejercicio: lo SUGERIDO se ve punteado hasta que lo tocas */
  .pftog.sug .t.on{border-style:dashed; opacity:.75;}
  .pfsec{display:flex; gap:6px; margin-bottom:6px;} .pfsec select{flex:1; min-width:0;}
  select.pfsel,#pf_gym,.pfw{height:44px; font-size:var(--t-section); background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:var(--r-ctl); padding:0 var(--s4); -webkit-appearance:none; appearance:none; width:100%;}
  .pfw{flex:0 0 72px; width:72px; padding:0 var(--s3); text-align:center;}
  .exrow .exn[data-act]{cursor:pointer;} .exrow .exp{font-size:var(--t-xs); color:var(--o50); margin-left:var(--s1);}
  .vbar{position:relative;height:3px;background:var(--track);} .vbar>i{display:block;height:100%;background:var(--fill);} .vbar .mev{position:absolute;top:-1px;width:1px;height:5px;background:var(--o40);}
  .submeta{font-size:var(--t-xs); color:var(--o40); padding-top:var(--s2);}

  /* macros rings */
  .hero{width:100%; background:none; border:0; color:inherit; font:inherit; display:flex; flex-direction:column; align-items:center; cursor:pointer;}
  .ring{position:relative;} .ring svg{display:block; width:100%; height:100%;}
  /* modo "restante": mismos colores — solo cambia QUÉ arco se llena (el restante, dibujado desde el final) */
  .ring-track{fill:none; stroke:var(--track); transition:stroke var(--dur-3) var(--ease-out);} .ring-fill{fill:none; stroke:var(--fill); stroke-linecap:round; transition:stroke-dasharray var(--dur-3) var(--ease-out), stroke-dashoffset var(--dur-3) var(--ease-out), stroke var(--dur-3) var(--ease-out);}
  .ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;}
  .ring.lg{width:132px; height:132px;} .ring.lg .ring-track,.ring.lg .ring-fill{stroke-width:1.4;} .ring.lg .num{font-size:26px/*ds:exempt*/; font-weight:800; letter-spacing:-1px/*ds:exempt*/;} .ring.lg .of{font-size:var(--t-xs); color:var(--o40); margin-top:6px;}
  .ring.md{width:72px; height:72px;} .ring.md .ring-track,.ring.md .ring-fill{stroke-width:1.8;} .ring.md .num{font-size:var(--t-body); font-weight:700;}
  .hero-meta{margin-top:var(--s4); font-size:var(--t-xs); color:var(--o40); display:flex; gap:var(--s3); align-items:center;} .hero-meta .left{color:var(--o60);} .chev{font-size:var(--t-caption); color:var(--faint); transition:transform var(--dur-2) var(--ease-out);} .hero.open .chev{transform:rotate(180deg);}
  .rings{display:flex; justify-content:space-between; padding:0 var(--s2);} .cell{display:flex; flex-direction:column; align-items:center; text-align:center; flex:1; cursor:pointer;}
  .cap{font-size:var(--t-xs); color:var(--fg); margin-top:10px;} .sub{font-size:var(--t-caption); color:var(--o40); margin-top:var(--s1);}
  .cell .sub{transition:color var(--dur-2);} .cell .cap{transition:color var(--dur-2);}
  .grp-label{font-size:var(--t-caption); color:var(--o40); letter-spacing:var(--ls-caps); margin-bottom:var(--sp-section);}
  /* progress dashboard tiles (área Progreso · layout Diseño) */
  .pfeat{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:var(--sp-card); margin-top:var(--s4);}
  .pfl{font-size:var(--t-caption); color:var(--o40); letter-spacing:var(--ls-caps); text-transform:uppercase; margin-bottom:var(--s3);}
  /* v226 · //SUPPS dentro de macros: un chip por toma, un toque = tomado. Sin acordeones que perder. */
  .supps{margin:0 0 var(--s5);}
  .supps .sph{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:var(--s3);}
  .spg{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
  .spl{flex:0 0 58px; font-size:var(--t-caption); letter-spacing:var(--ls-caps); color:var(--o35);}
  .spc{display:inline-flex; align-items:center; height:36px; font-size:var(--t-meta); padding:0 var(--s4); border:.5px solid var(--o20); border-radius:var(--r-pill); cursor:pointer; color:var(--fg); white-space:nowrap; -webkit-user-select:none; user-select:none;}
  .spc .k{color:var(--o40); margin-right:var(--s2);}
  .spc.on{color:var(--o35); border-color:var(--o10);} .spc.on .k{color:var(--good);}
  /* v226 · racha (comida O gym) + calendario de dos meses, estilo "last 30 days" de Bevel en monocromo */
  .strk-top{display:flex; justify-content:space-between; align-items:flex-end; gap:10px; margin-top:var(--s2);}
  .strk-n{font-size:var(--t-hero); font-weight:800; letter-spacing:var(--ls-num); line-height:1;} .strk-n span:not([data-nk]){font-size:var(--t-body); font-weight:400; color:var(--o50); letter-spacing:0; margin-left:var(--s2);}
  .strk-side{font-size:var(--t-xs); color:var(--o50); text-align:right; line-height:1.6;} .strk-side b{color:var(--fg); font-weight:800;}
  .strk-sub{font-size:var(--t-xs); color:var(--o40); margin-top:var(--s3); line-height:1.4;}
  .cal2{display:grid; grid-template-columns:1fr 1fr; gap:var(--s4); margin-top:var(--s4);}
  .cm .cmh{font-size:var(--t-caption); letter-spacing:var(--ls-caps); text-transform:uppercase; color:var(--o50); margin-bottom:6px;}
  .cm .cmw,.cm .cmg{display:grid; grid-template-columns:repeat(7,1fr); gap:var(--s2);}
  .cm .cmw{margin-bottom:var(--s2);} .cm .cmw b{font-size:var(--t-caption); font-weight:400; color:var(--o35); text-align:center;}
  .cd{display:block; height:13px; border-radius:var(--r-mark); background:var(--track); position:relative;}
  .cm .cd{cursor:pointer;} .cm .cd.e{background:none; cursor:default;} .cm .cd.f{background:none; box-shadow:inset 0 0 0 .5px var(--o10); cursor:default;}
  .cd.l1{background:var(--o60);} .cd.l2{background:var(--good);}
  .cm .cd.t{box-shadow:0 0 0 1px var(--fg);} .cm .cd.t.l0::after{content:''; position:absolute; left:50%; top:50%; width:3px; height:3px; margin:-1.5px 0 0 -1.5px/*ds:exempt*/; border-radius:50%; background:var(--fg);}
  .calleg{display:flex; gap:var(--s4); flex-wrap:wrap; margin-top:10px; font-size:var(--t-caption); color:var(--o40);} .calleg span{display:flex; align-items:center; gap:6px;} .calleg .cd{width:14px; height:9px; border-radius:var(--r-mark);}
  /* v227 · gráfica de detalle: etiquetas HTML sobre el SVG (Y a la derecha, fechas abajo, promedio con
     pastilla) y capa de scrub. touch-action:none solo en la gráfica: ahí el dedo es para leerla. */
  .chwrap{position:relative; margin:var(--s4) 0 var(--s1); padding-right:40px/*ds:exempt*/; touch-action:none; -webkit-user-select:none; user-select:none; cursor:crosshair;}
  .chy{position:absolute; right:0; transform:translateY(-50%); font-size:var(--t-caption); color:var(--o40); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .chavg{position:absolute; left:4px; transform:translateY(-50%); font-size:var(--t-caption); color:var(--o70); background:var(--sheet-bg); border:.5px solid var(--o20); border-radius:var(--r-pill); padding:1px 6px; pointer-events:none; white-space:nowrap;}
  .chxs{position:relative; height:12px; margin:var(--s2) 40px var(--s2) 0/*ds:exempt*/;}
  .chx{position:absolute; top:0; font-size:var(--t-caption); color:var(--o40); transform:translateX(-50%); white-space:nowrap;} .chx.a0{transform:none;} .chx.a1{transform:translateX(-100%);}
  .chscrub{position:absolute; top:0; bottom:0; left:0; right:40px; pointer-events:none; display:none;} .chwrap.scrub .chscrub{display:block;}
  .chsl{position:absolute; top:0; bottom:0; width:0; border-left:1px dashed var(--o50);}
  .chsd{position:absolute; width:10px; height:10px; margin:-5px 0 0 -5px/*ds:exempt*/; border-radius:50%; background:var(--fill); box-shadow:0 0 0 2px var(--sheet-bg);}
  .chst{position:absolute; top:-4px; transform:translate(-50%,-100%); font-size:var(--t-xs); color:var(--fg); background:var(--card2); border:.5px solid var(--o20); border-radius:var(--r-pill); padding:var(--s2) var(--s3); white-space:nowrap;}
  .chhint{font-size:var(--t-caption); color:var(--o30); text-align:center; margin:0 0 10px;}

  delts:{n:'delts', es:'hombro',  lm:[8,22,26],  members:['side_delts','front_delts','rear_delts']},
  back: {n:'back',  es:'espalda', lm:[10,22,25], members:['lats','upper_back']},
  legs: {n:'legs',  es:'pierna',  lm:null,       members:['quads','hamstrings','glutes','adductors','calves']},
  arms: {n:'arms',  es:'brazo',   lm:null,       members:['biceps','triceps','forearms']}
};
const mNorm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
// etiqueta (sin acentos) → id canónico o grupo. Solo lectura interna: nunca se escribe sobre sus datos.
const LABEL_CANON=(function(){ const m={}; const put=(id,arr)=>arr.forEach(k=>{ m[mNorm(k)]=id; });
  put('chest',['chest','pecho','pectoral','pectorales','pecs','pec']);
  put('lats',['lats','lat','dorsal','dorsales','latissimus']);
  put('upper_back',['mback','mid back','midback','middle back','upper back','espalda media','espalda alta','rhomboids','romboides']);
  put('traps',['traps','trap','trapecio','trapecios']);
  put('front_delts',['front delts','front delt','anterior delts','deltoides anterior','deltoide anterior','hombro frontal']);
  put('side_delts',['side delts','side delt','lateral delts','lateral delt','deltoides lateral','deltoide lateral','hombro lateral']);
  put('rear_delts',['rear delts','rear delt','posterior delts','deltoides posterior','deltoide posterior','hombro posterior']);
  put('biceps',['biceps','bicep','bíceps']);
  put('triceps',['triceps','tricep','tríceps']);
  put('forearms',['forearms','forearm','antebrazo','antebrazos','grip']);
  put('quads',['quads','quad','quadriceps','cuadriceps','cuádriceps']);
  put('hamstrings',['hams','ham','hamstring','hamstrings','femoral','femorales','isquios','isquiotibiales','isquiosurales']);
  put('glutes',['glutes','glute','gluteo','gluteos','glúteo','glúteos','abductor','abductors','abductores']);
  put('adductors',['adductor','adductors','aductor','aductores']);
  put('calves',['calves','calfs','calf','pantorrilla','pantorrillas','gemelos','soleo','sóleo']);
  put('abs',['abs','ab','abdominales','abdomen','core','obliques','oblicuos']);
  put('neck',['neck','cuello']);
  put('lower_back',['lower back','lumbar','lumbares','erectors','erectores']);
  put('grp:delts',['delts','delt','shoulder','shoulders','hombro','hombros','deltoids','deltoide','deltoides']);
  put('grp:back',['back','espalda']);
  put('grp:legs',['legs','leg','pierna','piernas']);
  put('grp:arms',['arms','arm','brazo','brazos']);
  return m; })();
// etiqueta → {id, group, src}: override del usuario (db.muscleMap) › tabla automática › desconocido
function muscleCanon(label){ const k=mNorm(label); if(!k)return {id:null,group:false,src:'unknown'};
  const ov=db&&db.muscleMap&&db.muscleMap[k]; const raw=(ov&&ov.id)||LABEL_CANON[k]||null;
  if(!raw)return {id:null,group:false,src:'unknown'};
  const grp=raw.indexOf('grp:')===0; const id=grp?raw.slice(4):raw;
  if(grp?!MUSCLE_GROUPS[id]:!MUSCLES[id])return {id:null,group:false,src:'unknown'};
  return {id,group:grp,src:ov?'user':'auto'}; }
// grupo ambiguo → músculo real por el NOMBRE del ejercicio (src 'inferred'; el usuario lo puede fijar)
function resolveGroup(group,exName){ const n=mNorm(exName);
  if(group==='delts'){ if(/rear|reverse (pec|fly|flye)|face ?pull|posterior|pajaro|pájaro/.test(n))return 'rear_delts';
    if(/lateral|lat raise|side|y[- ]?raise|upright|elevacion/.test(n))return 'side_delts';
    if(/press|ohp|overhead|military|arnold|front|frontal/.test(n))return 'front_delts'; return null; }
  if(group==='back'){ if(/pulldown|pull ?down|pull ?ups?|chin|jalon|dominad|pullover|lat /.test(n))return 'lats';
    if(/row|remo|rhomb|shrug|chest ?supp|t-?bar|seal/.test(n))return 'upper_back'; return null; }
  if(group==='legs'){ if(/calf|toe press|pantorr|gemel/.test(n))return 'calves'; if(/adduct|aduct/.test(n))return 'adductors';
    if(/hip thrust|glute|kick ?back|abduct|bridge|gluteo/.test(n))return 'glutes';
    if(/leg curl|curl|rdl|sldl|deadlift|hyper|good ?morning|nordic|femoral/.test(n))return 'hamstrings';
    if(/squat|squad|leg press|hack|ext|lunge|split|pendulum|sissy|sentadilla|prensa|zancada/.test(n))return 'quads'; return null; }
  if(group==='arms'){ if(/tri|pushdown|skull|dip|kickback|frances/.test(n))return 'triceps'; if(/curl/.test(n))return 'biceps'; if(/wrist|muneca|grip/.test(n))return 'forearms'; return null; }
  return null; }
// músculos del MOTOR de un ejercicio: [{id, w, label, src}] — override del ejercicio (db.exCat[name].targets,
// src 'user') › cada etiqueta mapeada (auto/user) › grupo resuelto por nombre ('inferred') › sin resolver (id null)
function targetsFor(ex){ if(!ex)return [];
  const ov=(exCatRec(ex.name)||{}).targets;
  if(Array.isArray(ov)&&ov.length) return ov.filter(t=>t&&MUSCLES[t.id]).map((t,i)=>({id:t.id,w:i===0?1:Math.max(0,Math.min(1,+t.w||0.5)),label:null,src:'user'}));
  return exMuscles(ex).map(m=>{ const c=muscleCanon(m.name);
    if(c.group){ const r=resolveGroup(c.id,ex.name); return {id:r,group:r?null:c.id,w:m.weight,label:m.name,src:r?'inferred':'unknown'}; }
    return {id:c.id,group:null,w:m.weight,label:m.name,src:c.src}; }); }
function exTargets(sw,ei){ const list=(sw&&sw.exercises)||[]; const e=list[ei]; if(!e)return []; return targetsFor(splitExFor(sw,ei)||e); }
// nombre visible de un id canónico: el que él haya puesto › SU etiqueta si exactamente una mapea directo › el corto
let _mLblCache={};   // se limpia en bumpIdx()
function muscleLabel(id){ if(!id)return '';
  if(db.muscleNames&&db.muscleNames[id])return db.muscleNames[id];
  if(_mLblCache[id]!=null)return _mLblCache[id];
  const mine=muscleSuggest().filter(l=>{ const c=muscleCanon(l); return !c.group&&c.id===id; });
  return (_mLblCache[id]=mine.length===1?mine[0]:((MUSCLES[id]&&MUSCLES[id].n)||(MUSCLE_GROUPS[id]&&MUSCLE_GROUPS[id].n)||id)); }
// landmarks de una ETIQUETA (las filas de //VOLUME siguen siendo sus etiquetas)
function landmarksForLabel(label){ const c=muscleCanon(label); if(!c.id)return null; return (c.group?(MUSCLE_GROUPS[c.id]||{}).lm:(MUSCLES[c.id]||{}).lm)||null; }
// pantalla "músculos": cómo entiende el motor cada etiqueta y cada ejercicio de un grupo ambiguo. Solo cambia la
// CLASIFICACIÓN (se resuelve en lectura para todo el historial); nunca toca lo que registraste.
function canonOptions(sel,withGroups){ let o=''; Object.keys(MUSCLES).forEach(id=>{ o+=`<option value="${id}"${sel===id?' selected':''}>${escTxt(MUSCLES[id].n)} · ${escTxt(MUSCLES[id].es)}</option>`; });
  if(withGroups)Object.keys(MUSCLE_GROUPS).forEach(g=>{ o+=`<option value="grp:${g}"${sel==='grp:'+g?' selected':''}>grupo ${escTxt(MUSCLE_GROUPS[g].n)} · por ejercicio</option>`; });
  return o; }
function openMuscleMap(){
  const labels=muscleSuggest(); const known=knownExercises();
  const uses={}; known.forEach(x=>exMuscles(x).forEach(m=>{ uses[m.name]=(uses[m.name]||0)+1; }));
  let rows='';
  labels.forEach(l=>{ const c=muscleCanon(l); const k=mNorm(l); const cur=db.muscleMap&&db.muscleMap[k]?db.muscleMap[k].id:'';
    const autoTxt=(()=>{ const a=LABEL_CANON[k]; if(!a)return 'sin mapear'; return a.indexOf('grp:')===0?'grupo '+a.slice(4):MUSCLES[a].n; })();
    rows+=`<div class="mmrow"><span class="mml">${escTxt(l)} <i>${uses[l]||0} ej.</i></span><select data-mm="label" data-k="${escTxt(k)}"><option value="">auto · ${escTxt(autoTxt)}</option>${canonOptions(cur,true)}</select></div>`
      +(c.src==='unknown'?`<div class="mmwarn">sin mapear: no cuenta para landmarks, recuperación ni sugerencias</div>`:''); });
  // ejercicios cuya etiqueta es un GRUPO (delts/back/legs/arms): qué músculo real es cada uno
  let exRows=''; known.forEach(x=>{ const t=targetsFor(x); const p=t[0]; if(!p)return; const c=muscleCanon(exMuscles(x)[0]&&exMuscles(x)[0].name);
    const ov=(exCatRec(x.name)||{}).targets; if(!(c.group||(ov&&ov.length)))return;
    const members=(MUSCLE_GROUPS[c.group?c.id:(MUSCLES[p.id]&&MUSCLES[p.id].g)]||{}).members||Object.keys(MUSCLES);
    const src=p.src==='user'?'fijado':p.src==='inferred'?'~ por el nombre':'sin resolver';
    exRows+=`<div class="mmrow"><span class="mml">${latTxt(x)}${escTxt(x.name)} <i>${src}</i> <a class="mmp" data-act="exprof" data-n="${escTxt(x.name)}" data-back="muscles">perfil ›</a></span><select data-mm="ex" data-n="${escTxt(x.name)}"><option value=""${p.id?'':' selected'}>${p.id?'auto':'— elige —'}</option>${members.map(id=>`<option value="${id}"${(p.src==='user'&&p.id===id)?' selected':''}>${escTxt(MUSCLES[id].n)}${p.src!=='user'&&p.id===id?' (~)':''}</option>`).join('')}</select></div>`; });
  openModal(`<h3>músculos</h3>
   <div class="submeta u-mb10">tus etiquetas se ven siempre como las escribiste · esto solo le dice al motor a qué músculo real corresponde cada una (volumen contra landmarks, recuperación, sugerencias) · aplica a todo tu historial</div>
   <div class="grp-label first">TUS ETIQUETAS</div>${rows||'<div class="submeta">aún no hay músculos</div>'}
   ${exRows?`<div class="grp-label sub">EJERCICIOS DE ETIQUETAS DE GRUPO</div><div class="submeta u-mb6">"delts" puede ser deltoides lateral, frontal o posterior según el ejercicio · ~ = deducido del nombre</div>${exRows}`:''}
   <div class="sheetbtns u-mt12"><button class="cancel" data-act="closemodal">listo</button></div>`);
  document.querySelectorAll('#modal select[data-mm]').forEach(s=>s.addEventListener('change',()=>{
    if(s.dataset.mm==='label'){ db.muscleMap=db.muscleMap||{}; if(s.value)db.muscleMap[s.dataset.k]={id:s.value,src:'user'}; else delete db.muscleMap[s.dataset.k]; }
    else { const nm=s.dataset.n; const x=known.find(z=>z.name===nm); if(!x)return;
      if(!s.value){ const r=exCatRec(nm); if(r){ delete r.targets; } }
      else { const cur=targetsFor(x).filter((t,i)=>i>0&&t.id).map(t=>({id:t.id,w:t.w})); setExCat(nm,{targets:[{id:s.value,w:1}].concat(cur.filter(t=>t.id!==s.value))}); } }
    save(); openMuscleMap(); }));
}
// ---------- v229 · PERFIL del ejercicio: resistencia, longitud muscular y músculos del motor ----------
// Perfil de resistencia (dónde del recorrido es más duro): asc = al final (músculo acortado) · desc = al inicio
// (músculo estirado) · mid = a mitad · unk = "no sé". Longitud: long (estirado) · mid · short (acortado) · mixed
// · unk. Son dos propiedades DISTINTAS (un ejercicio puede ser ascendente y a la vez entrenar el músculo largo).
// Dónde vive (decisión del dueño): máquina/polea/smith → resistencia POR GYM (la leva o polea de cada gym es otra)
// en db.exCat[name].rpGym[gym]; peso libre/corporal → una sola (exCat.rp). Longitud → exCat.len (es del movimiento).
// Principio de PT2: "la app no debe pretender saber más de lo que sabe" — lo sugerido va marcado "~" y solo se
// vuelve tuyo si lo tocas; "no sé" es una respuesta válida y apaga la sugerencia.
const RP_OPTS=[['asc','⬆ ascendente','más duro al final (músculo acortado)'],['desc','⬇ descendente','más duro al inicio (músculo estirado)'],['mid','↔ media','más duro a mitad del recorrido'],['unk','? no sé','no se asume nada']];
const LEN_OPTS=[['long','estirado'],['mid','media'],['short','acortado'],['mixed','mixto'],['unk','? no sé']];
const RP_GLYPH={asc:'⬆',desc:'⬇',mid:'↔'}, LEN_TXT={long:'estirado',mid:'media',short:'acortado',mixed:'mixto'};
// sugerencias SOLO donde la evidencia/biomecánica es sólida. types = solo aplica a esos tipos.
const EX_HINTS=[
  {re:/\b(rdl|sldl|romanian|rumano|stiff|straight ?leg)\b|piernas rectas/, rp:'desc', len:'long', types:['free'], why:'cadera flexionada al fondo: isquios en su máxima longitud; con barra lo más duro es abajo'},
  {re:/seated (leg )?curl|curl (femoral )?sentado/, len:'long', why:'cadera flexionada: isquios más largos que acostado — más hipertrofia sentado (Maeo 2021)'},
  {re:/(lying|laying|prone) (leg )?curl|curl (femoral )?acostado/, len:'short', why:'cadera extendida: isquios más cortos que sentado (Maeo 2021)'},
  {re:/(overhead|o\/h|over ?head).*(tri|ext)|french press|katana/, len:'long', why:'brazo sobre la cabeza: cabeza larga del tríceps estirada — más crecimiento que el pushdown (Maeo 2023)'},
  {re:/push ?down|pressdown/, len:'short', why:'hombro neutro y codo extendido al final: tríceps acortado (Maeo 2023)'},
  {re:/incline (db |dumbbell )?curl|bayesian/, len:'long', why:'hombro extendido: cabeza larga del bíceps estirada'},
  {re:/(lateral|side) (raise|rise)|elevacion lateral/, rp:'asc', len:'short', types:['free'], why:'con mancuerna el brazo pesa más al llegar arriba: más duro al final, deltoides acortado'},
  {re:/(db|dumbbell) (fly|flye)|aperturas? con mancuerna/, rp:'desc', len:'long', types:['free'], why:'con mancuerna lo más duro es abajo, con el pecho estirado'},
  {re:/standing calf|calf (raise|rise)s? de pie|pantorrilla de pie/, len:'long', why:'rodilla extendida: gastrocnemio más largo que sentado; el rango estirado es el más productivo (Kassiano 2023)'}
];
function exHint(name,type){ const n=mNorm(name), t=canonType(type||'free'); return EX_HINTS.find(hn=>hn.re.test(n)&&(!hn.types||hn.types.indexOf(t)>=0))||null; }
function isMachType(type){ return ['machine','smith','cable'].indexOf(canonType(type||''))>=0; }
// perfil efectivo de un ejercicio en un gym: lo tuyo › sugerencia › desconocido (con su procedencia)
function profileFor(ex,gym){ if(!ex)return null; const cat=exCatRec(ex.name)||{}; const mach=isMachType(ex.type); const hint=exHint(ex.name,ex.type);
  let rp='unk', rpSrc='unknown';
  if(mach){ const v=cat.rpGym&&gym?cat.rpGym[gym]:null; if(v){ rp=v; rpSrc='user'; } }
  else if(cat.rp){ rp=cat.rp; rpSrc='user'; }
  if(rpSrc==='unknown'&&hint&&hint.rp){ rp=hint.rp; rpSrc='suggested'; }
  let len='unk', lenSrc='unknown'; if(cat.len){ len=cat.len; lenSrc='user'; } else if(hint&&hint.len){ len=hint.len; lenSrc='suggested'; }
  return {rp,rpSrc,len,lenSrc,mach,gym:gym||'',why:hint?hint.why:''}; }
// en lectura para una sesión (usa el gym DE ESA sesión); nunca se copia a la sesión
function exProfileOf(sw,ei){ const e=((sw&&sw.exercises)||[])[ei]; if(!e)return null; return profileFor(splitExFor(sw,ei)||e,(sw&&sw.gym)||db.activeGym); }
function profileTag(p){ if(!p)return ''; const a=[]; if(p.rp!=='unk')a.push((RP_GLYPH[p.rp]||'')+(p.rpSrc==='suggested'?'~':'')); if(p.len!=='unk')a.push(LEN_TXT[p.len]+(p.lenSrc==='suggested'?'~':'')); return a.join(' '); }
function setRpForGym(name,gym,v){ const cur=exCatRec(name)||{}; const g=Object.assign({},cur.rpGym||{}); if(v)g[gym]=v; else delete g[gym]; setExCat(name,{rpGym:g}); }
// modal de perfil (desde el catálogo o la pantalla de músculos). back = a dónde volver al cerrar.

  const srcTxt=s=>s==='user'?'tuyo':s==='suggested'?'~ sugerido · toca para confirmarlo':'sin definir';

  const sec=tg.slice(1).map((t,i)=>`<div class="pfsec"><select class="pfsel" data-sec="${i}"><option value="">— quitar —</option>${mOpt(t.id)}</select><input class="pfw" data-secw="${i}" type="number" inputmode="decimal" step="0.05" min="0" max="1" value="${t.w}"/></div>`).join('');

  openModal(`<h3>perfil · ${latTxt(ex)}${escTxt(ex.name)}</h3>
   <div class="submeta u-mb8">${escTxt(ex.type||'free')}${p.mach&&gym?` · en <b>${escTxt(gym)}</b>`:''}</div>
   ${p.mach&&gyms.length>1?`<div class="field"><label>GYM (la máquina de cada gym puede ser distinta)</label><select id="pf_gym">${gyms.map(g=>`<option value="${escTxt(g)}"${g===gym?' selected':''}>${escTxt(g)}</option>`).join('')}</select></div>`:''}
   <div class="grp-label first">MÚSCULOS DEL MOTOR <span class="u-o35 u-w4">· ${tSrc}</span></div>
   <div class="submeta u-mb6">tus etiquetas no cambian · esto es a qué músculo real cuenta el volumen, la recuperación y las sugerencias</div>
   <div class="field"><label>PRIMARIO</label><select id="pf_prim" class="pfsel"><option value="">— sin resolver —</option>${mOpt(tg[0]&&tg[0].id)}</select></div>
   <div class="field"><label>SECUNDARIOS · cuánto cuenta la serie (0–1)</label><div id="pf_secs">${sec}</div><button class="addbtn u-mt4" data-act="pf_addsec">[+ secundario]</button></div>
   <div class="grp-label sub">PERFIL DE RESISTENCIA <span class="u-o35 u-w4">· ${p.mach?'de la máquina de '+escTxt(gym||'este gym'):'todos los gyms'} · ${srcTxt(p.rpSrc)}</span></div>
   ${tog('pf_rp',RP_OPTS,p.rp,p.rpSrc)}
   <div class="submeta u-mt4 u-mb0 u-mx0">⬆ más duro al final (acortado) · ⬇ más duro al inicio (estirado) · ↔ a mitad</div>
   <div class="grp-label sub">LONGITUD MUSCULAR <span class="u-o35 u-w4">· dónde trabaja el músculo · ${srcTxt(p.lenSrc)}</span></div>

   <div class="sheetbtns u-mt12"><button class="ok" data-act="pf_save">guardar</button><button class="cancel" data-act="pf_close">cancel</button></div>`);
  // una sugerencia solo se vuelve tuya si TOCAS esa fila (aunque elijas lo mismo)
  ['pf_rp','pf_len'].forEach(id=>{ const el=document.getElementById(id); if(el)el.addEventListener('click',()=>{ el.dataset.touched='1'; el.classList.remove('sug'); }); });
  const tw=document.getElementById('modal'); if(tw)tw.querySelectorAll('#pf_prim,.pfsel,.pfw').forEach(x=>x.addEventListener('change',()=>{ tw.dataset.tTouched='1'; }));
  const gs=document.getElementById('pf_gym'); if(gs)gs.addEventListener('change',()=>openExProfile(ex.name,back,gs.value));
}
function saveExProfile(){ const ctx=window._exProf; if(!ctx)return; const m=document.getElementById('modal'); const nm=ctx.name;
  const pv=id=>{ const e=document.querySelector('#'+id+' .t.on'); return e?e.dataset.v:''; };

  if(lenEl&&lenEl.dataset.touched)setExCat(nm,{len:pv('pf_len')});

      setExCat(nm,{targets:[{id:prim,w:1}].concat(secs)}); } }
  save(); toast('✓ perfil del ejercicio guardado'); closeProfileBack(ctx.back); }
function closeProfileBack(back){ window._exProf=null; if(back==='catalog')openExerciseDirectory(); else if(back==='muscles')openMuscleMap(); else { closeModal(); reRender(); } }
// ---------- v230 · RECUPERACIÓN por músculo (estimada → observada) y tablero //MÚSCULOS ----------
// PT2: "la recuperación debería ser individual, no un número fijo". Cada músculo canónico arranca con una
// ventana ESTIMADA (MUSCLES[id].rec, ajustada por la dosis de esa sesión) y, cuando su propio historial tiene

  const wk=(off)=>{ const now=new Date(); const a=new Date(now); a.setDate(now.getDate()-7*off-7); const b=new Date(now); b.setDate(now.getDate()-7*off); const ai=todayISO(a),bi=todayISO(b); const best={};
    db.sessions.forEach(s=>{ if(s.type==='rest'||s.date<ai||s.date>=bi)return; (s.exercises||[]).forEach(e=>{ if(isCardio(e))return; (e.sets||[]).forEach(st=>{ if(bwMissing(st))return; const w=effW(st),r=parseFloat(st.r)||0; if(w&&r){ const e1=w*(1+effRepsForE1RM(st)/30); if(!best[e.name]||e1>best[e.name].v)best[e.name]={v:e1,uni:uniOf(e),type:e.type}; } }); }); }); return best; };
  const cur=wk(0),prev=wk(1); const out=[];

// weekly cardio aggregates (min/distance/kcal) — registered for recovery/fatigue hooks; motor de recuperación can consume later
function weeklyCardio(days){ days=days||7; const now=new Date(); const cut=new Date(now); cut.setDate(now.getDate()-days); const c=todayISO(cut);
  let minutes=0,distance=0,calories=0,bouts=0; const bySub={};
  (db.sessions||[]).forEach(s=>{ if(s.type==='rest'||s.date<=c)return;
    (s.exercises||[]).forEach(e=>{ if(!isCardio(e))return; const sub=e.cardioSub||'treadmill';
      (e.sets||[]).forEach(st=>{ if(!setPersistable(st)&&!(st&&!st._pf&&st.minutes))return;
        bouts++; const m=parseFloat(st.minutes)||0, d=parseFloat(st.distance)||0, k=parseFloat(st.calories)||0;

// LEGACY per-set score (setScore — deprecated in v219, no UI consumer; the tension model further down replaced it):
//   Epley e1RM × intensityFactor × flat proximity bonus.
//   e1RM = w × (1 + reps_to_failure/30) — same weight/reps with LOWER RIR → lower e1RM (you got weaker / harder day).
//   intensityFactor (i = 1/(1+rtf/30)): i<0.55 (>24.5 reps to failure) → 0 · 0.55-0.65 (16-24.5) → ramp 0→1 · ≥0.65 → 1
// ── failure semantics (canonical) ───────────────────────────────────────────
// r = reps COMPLETED; rir='F' = failure (attempted the NEXT rep, missed it). 5@RIR0 ({r:5,rir:'0'}) and
// 6F ({r:5,rir:'F'}) are DISTINCT events. Strength/e1RM treats them equal (5 clean reps, reserve 0);
// the stimulus score (setScore) ranks F > RIR0 > RIR>0 via proximityMult. failType optional, additive.
function setReps(s){ const r=parseFloat(s&&s.r); return r>0?r:0; }                 // reps COMPLETED
function isFailure(s){ return String(s&&s.rir==null?'':s.rir).trim().toUpperCase()==='F'; }
function setRIR(s){ const t=String(s&&s.rir==null?'':s.rir).trim().toUpperCase(); if(t===''||t==='F')return 0; const n=parseFloat(t); return isNaN(n)?0:Math.max(0,Math.min(6,n)); }
function failRep(s){ return isFailure(s)? setReps(s)+1 : null; }                    // derived (= reps+1)
function setFailType(s){ return (s&&s.failType)||null; }                            // 'concentrico'|'parcial'|'asistido'|null
function effRepsForE1RM(s){ return setReps(s)+setRIR(s); }   // Epley input = completed reps + reserve (F→0, ''→0)
// ---- bodyweight: base = latest REGISTERED bodyweight, always live (recalculates even for past
// sessions when you re-weigh in — the owner's explicit call, no frozen snapshot). extraW is the lastre. ----
function latestBodyweight(){ const k=Object.keys(db.bodyweight||{}).sort(); return k.length?(+db.bodyweight[k[k.length-1]]||null):null; }
// effective load of a set: bodyweight sets use the LIVE latest bodyweight as base (s.w is legacy

function bloating(t,g){
  // Subcutaneous (extracellular) water-retention tendency — acute, same-day heuristic.
  // FOOD drives retention: Na:K balance dominates (validated marker; K drives natriuresis), acute Na load,
  // hydration (low intake -> RAAS/ADH retention), sugar/insulin-driven Na reabsorption, alcohol (ADH/rebound).
  // ACTIVITY relieves it same-day: a gym session + steps mobilize extracellular fluid (sweat, sympathetic
  // diuresis, venous/lymphatic return). Carbs/glycogen water excluded (muscle fullness, not skin puffiness).
  const c=x=>Math.max(0,Math.min(1,x));
  const naK=t.sodium/Math.max(t.potassium,1);                  // Na:K mass ratio
  const naKterm=c((naK-0.5)/1.5);                              // ~0.5 balanced (WHO 2000/3500), >=2.0 high
  const naAbs=c(((t.sodium/(g.sodium||2300))-0.8)/0.7);        // big acute sodium load
  const hyd=c(1-t.water/(g.water||3));                         // under-drinking -> retention
  const sugar=c((t.sugar/(g.sugar||50))-1);                    // sugar/insulin -> acute Na reabsorption
  const alc=c((t.alcohol||0)/28);                              // alcohol ~2 drinks -> notable
  const nutr=42*naKterm + 14*naAbs + 22*hyd + 12*sugar + 18*alc;  // food-driven retention, 0..~108
  // ── same-day activity relief (reads Gym sessions + Habits steps for the displayed day) ──
  const day=curDate();
  const sess=(db.sessions||[]).filter(s=>s&&s.date===day&&s.type!=='rest');
  const trained=sess.some(s=>(s.exercises||[]).some(e=>(e.sets||[]).some(st=>st&&(st.done||(+st.w>0)||(+st.r>0)))));
  const trainSec=sess.reduce((mx,s)=>Math.max(mx,(+s.durSec||0)),0);
  const trainRelief=trained?Math.max(0.6,c(trainSec/3600)):0;  // a logged workout >=0.6, full at ~60min
  const steps=(db.steps&&+db.steps[day])||0;
  const stepRelief=c(steps/10000);                             // 10k steps -> full step relief
  const activity=c(0.6*stepRelief + 0.7*trainRelief);          // combined 0..1
  const sedentary=(!trained && steps>0 && steps<3000)?8*c((3000-steps)/3000):0;  // pooling when truly sedentary
  let sc=nutr*(1 - 0.32*activity) + sedentary;                 // activity shaves up to ~32% off the food load
  sc=Math.max(0,Math.min(100,Math.round(sc)));
  // Actionable suggestions — what to prioritize to de-bloat
  const tips=[];
  if(naK>1.2) tips.push('prioriza potasio (plátano, papa, espinaca, agua de coco)');
  if((t.sodium/(g.sodium||2300))>1) tips.push('baja sodio el resto del día');
  if(hyd>0.3) tips.push('toma más agua (paradójicamente reduce retención)');
  if(alc>0.2) tips.push('alcohol alto → hidrata + electrolitos antes de dormir');
  if(sugar>0.2) tips.push('reduce azúcar/refinados');
  if(!trained && steps<6000) tips.push('muévete: caminar/entrenar drena líquido (sudor + circulación)');
  else if(activity>0.4 && nutr>28) tips.push('tu actividad de hoy ya está bajando la retención ✓');
  if(!tips.length) tips.push('balance ok · Na:K, agua y actividad estables');
  return {sc,label:sc<34?'low':sc<67?'mod':'high',tips};
}

function suppStripHTML(iso){
  const all=(db.stack||[]).filter(x=>x&&!x.archived&&isDueToday(x,iso));
  if(!all.length)return '';
  const ORDER=[['AM','AM'],['PM','PM'],['entreno','ENTRENO'],['otros','OTROS']];
  const slot=it=>{ const w=it.when||[]; for(const [k] of ORDER){ if(k!=='otros'&&w.indexOf(k)>=0)return k; } return 'otros'; };  // un item con varios momentos sale en el primero (1 tick por día)
  const done=it=>tickDone(it.ticks&&it.ticks[iso]);
  const nDone=all.filter(done).length;
  let rows='';
  ORDER.forEach(([k,lbl])=>{ const items=all.filter(it=>slot(it)===k); if(!items.length)return;
    items.sort((a,b)=>(done(a)-done(b)));
    rows+=`<div class="spg"><span class="spl">${lbl}</span>`+items.map(it=>{ const on=done(it); const tt=on&&it.tickTimes&&it.tickTimes[iso];
      return `<span class="spc${on?' on':''}" data-act="suppq" data-id="${escTxt(it.id)}" data-d="${iso}" title="${on?'tomado'+(tt?' a las '+escTxt(tt):'')+' · toca para deshacer':'toca = tomado'}"><span class="k">${on?'✓':'○'}</span>${escTxt(it.name||'supp')}</span>`; }).join('')+`</div>`;
  });
  return `<div class="supps"><div class="sph"><div class="h u-meta u-w8 u-lsui"><span class="s u-o40">//</span>SUPPS <span class="u-o40 u-w4">· ${nDone}/${all.length}</span></div><a data-act="nav" data-screen="stack" class="u-xs u-o50 u-tap">[administrar]</a></div>${rows}</div>`;
}
// un toque: pendiente → tomado (con su hora real, que nunca se pisa) · tomado/tarde → sin marcar
function suppQuickTick(id,iso){

  it.ticks=it.ticks||{};

}

// v225 — el resumen de compartir era grande, con mucho hueco, y no decía nada: "60 × 11" sin unidad,

// drop con su %) con la densidad de //EFFECTIVE VOLUME. La unidad va una sola vez por ejercicio cuando

function _shWR(x,showU){ return numTxt(effW(x))+(showU?escTxt(x.unit||''):'')+'×'+((x.r!=null&&x.r!=='')?escTxt(String(x.r)):'-'); }

function shareExLines(e){
  const all=e.sets||[]; const step=e.unilateral?2:1;
  const ok=x=>!!(x&&(x.w||x.r)&&!x._pf);

  const uk=Object.keys(units); const one=uk.length===1?uk[0]:''; const showU=!one;

  for(let i=0;i<all.length;i+=step){
    const a=all[i], b=(step===2)?all[i+1]:null;
    if(!ok(a)&&!ok(b))continue;
    let txt;

function isDueToday(item, iso){
  if(!item || item.archived) return false;
  if(item.startDate && iso < item.startDate) return false;
  if(item.endDate && iso > item.endDate) return false;
  const p=item.periodization||{type:'daily'};
  if(p.type==='daily' || p.type==='range') return true;
  if(p.type==='weekly'){ const d=new Date(iso+'T12:00:00').getDay(); return (p.value||[]).indexOf(d)>=0; }
  const base=new Date((item.startDate||iso)+'T12:00:00').getTime();
  const days=Math.round((new Date(iso+'T12:00:00').getTime()-base)/86400000);
  if(p.type==='everyN'){ const n=Math.max(1,+p.value||1); return days>=0 && days%n===0; }
  if(p.type==='cycle'){ const on=Math.max(0,+(p.value&&p.value.on)||0), off=Math.max(0,+(p.value&&p.value.off)||0); if(on+off===0) return true; return days>=0 && (days%(on+off))<on; }
  if(p.type==='occasional') return false;
  return true;
}
function stackPeriodLabel(item){
  const p=item.periodization||{type:'daily'};
  if(p.type==='daily') return 'diario';
  if(p.type==='weekly'){ const D=['D','L','M','M','J','V','S']; return (p.value||[]).slice().sort((a,b)=>a-b).map(d=>D[d]).join(' ')||'—'; }
  if(p.type==='everyN') return 'cada '+(p.value||2)+' días';
  if(p.type==='cycle') return 'ciclo '+(p.value?p.value.on:21)+'on/'+(p.value?p.value.off:7)+'off';
  if(p.type==='range') return 'rango'+(item.endDate?(' → '+item.endDate.slice(5)):'');

  return '';

function renderStack(){
  const iso=todayISO();
  const all=db.stack||[];
  const view=window._stackView||'today';
  const pct=stackPct(iso);
  let out=statusBar(false)
    +`<hr class="rule"/><div class="section"><div class="h"><span class="s">//</span>STACK</div><div class="meta">${pct?(pct.done+'/'+pct.total+' · '+pct.pct+'%'):'sin items'}</div></div>`;
  const tab=(k,l)=>`<span data-act="stackview" data-v="${k}"${view===k?' class="on"':''}>${l}</span>`;
  out+=`<div class="mdtabs" data-tk="stack">${tab('today','HOY')}${tab('all','TODOS')}</div>`;
  if(!all.length){
    out+=`<div class="empty u-mt24 u-mb16 u-mx0">stack vacío<br/><span class="ehint">agrega tu primer suplemento, skincare o medicamento abajo</span></div>`;
  } else {
    // agrupado por TIMING (no por categoría): bloques colapsables AM/PM/ENTRENO/OTROS
    const BLOCKS=[{k:'AM',lbl:'AM'},{k:'PM',lbl:'PM'},{k:'entreno',lbl:'ENTRENO'},{k:'otros',lbl:'OTROS'}];
    const inBlock=(it,bk)=>{ const w=it.when||[]; return bk==='otros' ? !(w.indexOf('AM')>=0||w.indexOf('PM')>=0||w.indexOf('entreno')>=0) : w.indexOf(bk)>=0; };
    // ponytail: 1 tick/día/item — un item multi-timing (AM+PM) aparece en ambos bloques y comparte el mismo check; si se requiere check por-horario, ticks[iso][block]
    const li=it=>{
      const st=it.ticks && tickState(it.ticks[iso]);
      const isDue=isDueToday(it,iso);
      const canTick=isDue||(it.periodization&&it.periodization.type==='occasional');
      const dose=it.dose?(' · '+escTxt(it.dose)+(it.unit?' '+escTxt(it.unit):'')):'';
      const when=it.when&&it.when.length?(' · '+escTxt(it.when.join('/'))):'';
      const _tt=it.tickTimes&&it.tickTimes[iso]; const timeChip=tickDone(it.ticks&&it.ticks[iso])?` · <span data-act="supptime" data-id="${it.id}" data-d="${iso}" class="u-tap u-ul u-o50">${_tt?escTxt(_tt):'+hora'}</span>`:'';
      const period=escTxt(stackPeriodLabel(it));
      const cat=` <span class="u-o30 u-cap">[${escTxt(it.category||'supp')}]</span>`;
      const _subs=(()=>{ var r=identifyAllSubstances(it.name); if(it.subId&&!r.find(s=>s.id===it.subId)){ var fb=SUBSTANCE_DB.find(s=>s.id===it.subId); if(fb)r.push(fb); } return r; })();
      let idMark=_subs.map(function(_sub){ if(_sub.kind==='active'){ return ` <span data-act="suppinfo" data-id="${it.id}" data-sub="${_sub.id}" class="u-tap u-o40 u-cap" title="ver ficha de ${escTxt(_sub.name)}">ⓘ</span>`; } else { const _hasN=it.nutr&&Object.keys(it.nutr).length; return _hasN?` <span class="u-good u-cap" title="aporta nutrición${it.nutrSrc==='db'?' · auto':''}">✓</span>`:` <span data-act="suppfill" data-id="${it.id}" data-sub="${_sub.id}" class="u-tap u-o40 u-cap" title="rellenar nutrición de ${escTxt(_sub.name)}">+ nutr</span>`; } }).join('');
      const tickDisp=canTick
        ?`<span data-act="stacktick" data-id="${it.id}" title="tap: tomado → tarde → saltado" style="cursor:pointer;font-family:'JetBrains Mono',monospace;color:${st?(st==='skipped'?'var(--bad)':'var(--fill)'):'var(--o40)'};padding-right:4px">[${st?TICK_SYM[st]:' '}]</span>`
        :`<span class="u-o20 u-pr4">[—]</span>`;
      return `<div class="line u-py6 u-px0 u-ais">`
        +`<span class="k u-flex u-aic u-wrap">${tickDisp}<span data-act="stackedit" data-id="${it.id}" class="u-tap">${escTxt(it.name)}</span><span class="u-o40 u-xs u-ml4">${dose}${when}${timeChip}</span>${cat}${idMark}</span>`
        +`<span class="dots"></span>`
        +`<span class="v u-xs u-o40 u-tr">${period}</span>`
        +`</div>`;
    };
    const visible=all.filter(x=>!x.archived && (view==='all'||isDueToday(x,iso)));
    let anyShown=false, openedYet=false;
    BLOCKS.forEach(b=>{

      const incomplete=due.some(x=>!tickState(x.ticks&&x.ticks[iso]));

    if(adhocHoy.length){
      const rows=adhocHoy.map((a,i)=>`<div class="line u-py6 u-px0 u-ais"><span class="k">${escTxt(a.name)}${a.compoundMg?' · '+a.compoundMg+' mg':''}${a.form?' ('+escTxt(a.form)+')':''}${a.time?' · '+escTxt(a.time):''}</span><span class="dots"></span><span class="v"><span data-act="deladhoc" data-i="${i}" class="u-tap u-bad">✕</span></span></div>`).join('');
      out+=`<details class="stk-blk" open><summary>TOMAS PUNTUALES · hoy</summary>${rows}</details>`;
    }
  }
  out+=`<hr class="rule"/><div class="u-flex u-gap8 u-mt12">`
    +`<button class="b u-f1" data-act="stackadd" data-c="supp">+ supp</button>`
    +`<button class="b u-f1" data-act="stackadd" data-c="skin">+ skin</button>`
    +`<button class="b u-f1" data-act="stackadd" data-c="meds">+ meds</button>`
    +`</div>`
    +`<div class="u-mt8"><button class="b u-w100" data-act="adhoclog">[+ toma puntual]</button></div>`;
  return out;
}

// ---------- render: split editor ----------
// v224: el editor mostraba db.split, pero desde v213 la sesión se siembra de la ÚLTIMA SESIÓN REAL del
// día (daySource) y nada de lo que cambias en vivo vuelve al split — de ahí "estoy en Change Split y no
// me sale mi split actualizado a como lo he ido modificando". Aquí se VE la diferencia y se adopta a
// mano; nunca automático (el split es su plan, no un registro).
function dayDrift(day){
  const ds=daySource(day); if(!ds.fromPrior)return null;
  const cur=(day.exercises||[]).map(e=>nameKey(e.name));
  const real=(ds.list||[]).map(e=>nameKey(e.name));
  if(cur.length===real.length&&cur.every((x,i)=>x===real[i]))return null;
  return {cur,real,list:ds.list,prior:ds.prior};
}
function adoptDaySource(di){
  const day=db.split&&db.split.days[di]; if(!day)return;
  const d=dayDrift(day); if(!d){ toast('ese día ya coincide'); return; }
  const names=d.list.map(e=>e.name).join(' · ');
  const _go3=()=>{
  // cada instancia que ya existía CONSERVA su id (su historial y su máquina cuelgan de ahí); las nuevas
  // acuñan el suyo. El conteo de series sale de las series de TRABAJO (los drops no son series del plan).
  const old=(day.exercises||[]).slice(); const used={};
  day.exercises=d.list.map(se=>{
    const k=nameKey(se.name);
    let prev=(se.exId?old.find(x=>x.id===se.exId):null)||old.find(x=>nameKey(x.name)===k&&!used[x.id])||null;
    if(prev)used[prev.id]=1;
    const base=prev?Object.assign({},prev):{id:'e'+uid()};
    const work=(se.sets||[]).filter(s=>s&&!s.isDrop).length;
    const nn=se.unilateral?Math.ceil(work/2):work;
    return Object.assign(base,{
      name:se.name, muscle:se.muscle||base.muscle,
      muscles:Array.isArray(se.muscles)?se.muscles.slice():base.muscles,
      type:se.type||base.type, unilateral:!!se.unilateral, startSide:se.startSide||base.startSide,
      assisted:se.assisted, weighted:se.weighted, cardioSub:se.cardioSub, unit:se.unit||base.unit,
      sets:Math.max(1,nn||base.sets||1)
    });
  });
  save(); render(); toast('✓ split actualizado · '+day.exercises.length+' ejercicios');
}; return trkAsk({title:'adoptar "'+(day.name||'')+'" como lo entrenaste',detail:'el '+((d.prior&&d.prior.date)||'')+':\n'+names,ok:'adoptar'},_go3);}

// R5 (D12): mini-calendario del mes arriba (TRKCal, ‹ › entre meses con sesiones; toque en un día → baja a esa sesión),
// meses como rail (línea + punto por sesión) y cada sesión se abre en sitio con sus series (formato de compartir).
// Lo abierto vive en state._histOpen (no se guarda); abrir/cerrar pasa por reRender → lo de abajo se reacomoda (TRKRow).
function histCalHTML(sess){
  const now=new Date(), curYM=now.getFullYear()*12+now.getMonth();
  const fp=String(sess.length?sess[sess.length-1].date:todayISO()).split('-'), minYM=Math.min(curYM,(+fp[0])*12+(+fp[1]-1));
  let ym=state._histYM; if(ym==null||!isFinite(ym)||ym>curYM)ym=curYM; if(ym<minYM)ym=minYM; state._histYM=ym;
  const y=Math.floor(ym/12), m=ym%12, pre=y+'-'+pad(m+1)+'-';
  const by={}; sess.forEach(s=>{ (by[s.date]=by[s.date]||[]).push(s); });
  const nm=sess.filter(s=>String(s.date).startsWith(pre)).length;
  const mark=iso=>{ const l=by[iso]; return l?{lv:1,act:'hcalday',title:l.map(s=>s.dayName||'sesión').join(' · ')}:{lv:0}; };
  return `<div class="hcal"><div class="hcalh"><button class="hcnav${ym>minYM?'':' off'}" data-act="hcalm" data-d="-1" aria-label="mes anterior">‹</button>`
    +`<span class="hct">${MONFULL[m]} ${y} · <b>${nm}</b> sesi${nm===1?'ón':'ones'}</span>`
    +`<button class="hcnav${ym<curYM?'':' off'}" data-act="hcalm" data-d="1" aria-label="mes siguiente">›</button></div>${monthCalHTML(y,m,mark,{head:false,num:true})}</div>`;
}

  (s.exercises||[]).forEach((e,ei)=>{ const r=shareExLines(e); if(!r.n)return;

function saveExEdit(){
  const {di,ei}=window._exEdit||{}; const name=val('ee_name'); if(!name){toast('⚠ pon un nombre','err');return;}
  const pv=id=>{const x=document.querySelector('#'+id+' .t.on');return x?x.dataset.v:'';};
  const t=pv('ee_type'); const validT=['machine','smith','cable','bodyweight','cardio','free'].indexOf(t)>=0?t:'free';
  // build canonical muscles array: primary (1.0) + optional secondary (custom decimal). Keep e.muscle = primary name for legacy code paths.
  const m1=(val('ee_muscle')||(validT==='cardio'?'cardio':'other')).toLowerCase().trim();
  const muscles=[{name:m1,weight:1}];
  const m2wrap=document.getElementById('ee_mus2wrap');
  if(m2wrap && m2wrap.style.display!=='none'){
    const m2=(val('ee_mus2')||'').toLowerCase().trim();
    if(m2){ const w2=Math.max(0,Math.min(1,parseFloat(document.getElementById('ee_mus2w').value)||0.5)); muscles.push({name:m2,weight:w2}); }
  }
  const isBwT=validT==='bodyweight';
  const isCardioT=validT==='cardio';
  const cardioSub=isCardioT?(pv('ee_cardiosub')||'treadmill'):undefined;
  const ex={name,muscle:m1,muscles,type:validT,machine:val('ee_machine'),unilateral:!isCardioT&&pv('ee_uni')==='1',startSide:(pv('ee_start')==='L'?'L':'R'),assisted:isBwT&&document.getElementById('ee_assisted')&&document.getElementById('ee_assisted').checked,weighted:isBwT&&document.getElementById('ee_weighted')&&document.getElementById('ee_weighted').checked,cardioSub,sets:Math.max(1,+val('ee_sets')||1)};
  const {liveExi,origName}=window._exEdit||{};
  if(liveExi!=null && db.activeWork && db.activeWork.exercises[liveExi]){
    const w=db.activeWork; const lx=w.exercises[liveExi];
    // update metadata IN PLACE — keep logged sets + the unilateral structure of the live session intact.
    // by default this change lives ONLY in today's session; the split stays untouched unless opted in below.
    const typeChanged=lx.type!==ex.type || (isCardioT&&lx.cardioSub!==ex.cardioSub);
    lx.name=ex.name; lx.muscle=ex.muscle; lx.muscles=ex.muscles; lx.type=ex.type; lx.machine=ex.machine; lx.assisted=ex.assisted; lx.weighted=ex.weighted; lx.cardioSub=ex.cardioSub; lx.unilateral=ex.unilateral; lx.startSide=ex.startSide;
    // switching into/out of cardio reseeds the set bag (field shapes differ)
    if(typeChanged){ lx.sets=seedSets(lx,Array.isArray(lx.sets)?Math.max(1,lx.sets.length):ex.sets,{dayId:w.dayId,orderIdx:liveExi}); }
    const toSplit=document.getElementById('ee_tosplit');
    if(toSplit && toSplit.checked){
      const di2=(db.split.days||[]).findIndex(d=>d.id===w.dayId);
      if(di2>=0){ const arr=db.split.days[di2].exercises||[];
        let j=lx.exId!=null?arr.findIndex(x=>x.id===lx.exId):-1;
        if(j<0){ const on=String(origName||'').toLowerCase().trim(); j=arr.findIndex(x=>(x.name||'').toLowerCase().trim()===on); }
        if(j>=0) arr[j]=Object.assign({},arr[j],{name:ex.name,muscle:ex.muscle,muscles:ex.muscles,type:ex.type,machine:ex.machine,unilateral:ex.unilateral,startSide:ex.startSide,assisted:ex.assisted,weighted:ex.weighted,cardioSub:ex.cardioSub});
      }
    }
    save(); closeModal(); render(); return;
  }
  // merge (never replace) so fields this form doesn't manage (note/unit/useFS from ironLOG import) survive,
  // and the instance id is preserved across edits — this only ever writes to THIS day's exercise, never others.
  if(ei<0){ db.split.days[di].exercises.push(Object.assign({id:'e'+uid()},ex)); }
  else { const prev=db.split.days[di].exercises[ei]||{}; db.split.days[di].exercises[ei]=Object.assign({},prev,ex,{id:prev.id||('e'+uid())}); }
  save(); toast('✓ ejercicio actualizado'); closeModal(); render();
}

// This makes exercise identity consistent across split days — pick a known name → auto-fill ALL its variables.
function knownExercises(){

    if(!map[k])map[k]={name:e.name};

    if(Array.isArray(e.muscles)&&e.muscles.length) o.muscles=e.muscles.slice();  // remember primary+secondary muscles
    if(e.sets!=null && typeof e.sets==='number') o.sets = e.sets;

// OpenFoodFacts only has barcoded packaged products; these cover the generic whole foods it lacks
// (huevo, res, cebolla…). Values are ~per-100 g edible portion (USDA-derived approximations);
// base:'ml' entries are per-100 ml. sodium/potassium in mg. sv=serving g · pc=piece g · ct=container g.
const bfNorm=s=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
// tolerant search: returns 0 (no match) or positive score (higher=better). Handles typos, partial words,
// out-of-order tokens, doubled letters, plurals. q is the raw query, f is a food.
function searchScore(q,f){ if(!q)return 0; const sn=bfNorm(q); const name=bfNorm(f.name||''), alt=bfNorm(f.alt||''), brand=bfNorm(f.brand||''); const hay=name+' '+alt+' '+brand;
  if(!sn||!hay.trim())return 0;
  // 1) Quick wins: exact substring anywhere
  if(name.indexOf(sn)===0)return 1000;            // starts with query → top
  if(name.indexOf(sn)>0) return 700;              // word in name
  if(brand.indexOf(sn)>=0)return 600;             // brand match
  if(alt.indexOf(sn)>=0) return 500;              // English alias
  // 2) Token search: every word of query must appear (substring) in hay  → handles "creama cacahuate" / "cacahuate crema"
  const tokens=sn.split(/\s+/).filter(Boolean); if(tokens.length>1){ let ok=true,sc=0; for(const t of tokens){ const p=hay.indexOf(t); if(p<0){ok=false;break;} sc+=Math.max(0,80-p); } if(ok) return 300+sc; }
  // 3) Subsequence (letters in order, gaps allowed) → "pllo"→"pollo", "ptina"→"proteina"
  let i=0,j=0,gaps=0; while(i<sn.length&&j<hay.length){ if(sn[i]===hay[j]){i++;j++;}else{j++;gaps++;} }
  if(i===sn.length){ const ratio=sn.length/(sn.length+gaps); if(ratio>=0.5) return Math.round(150+ratio*100); }
  // 4) 1-edit fuzzy on the first word (single typo, swap, missing/extra letter): "creama"<->"crema"
  const w0=name.split(/\s+/)[0]||name; if(Math.abs(w0.length-sn.length)<=2 && sn.length>=3){
    let a=w0,b=sn; if(a.length<b.length){const t=a;a=b;b=t;}
    let edits=0,k=0; for(let l=0;l<a.length;l++){ if(a[l]===b[k]) k++; else { edits++; if(edits>1) break; if(a.length>b.length) continue; k++; } }
    if(edits<=1 && k>=b.length-1) return 120;
  }
  return 0;
}

function renderOFFRows(term){ const list=document.getElementById('fa_list'); const res=window._ofRes; if(!list||!res||!res.length)return false;

  const html=res.slice(0,15).map((f,i)=>`<div class="pickitem" data-act="ofpick" data-i="${i}">${escTxt(f.name)}${srcMark(f)}${f.brand?' <span class="u-o35 u-xs">'+escTxt(f.brand)+'</span>':''} <span class="u-fr u-o50">${Math.round((f.per100&&f.per100.kcal)||foodKcal100(f)||0)} /100${f.base==='ml'?'ml':'g'}</span></div>`).join('');

  list.insertAdjacentHTML('beforeend',head+html); return true; }

function servingToLiters(sz){
  if(!sz)return 0;
  const m=(sz+'').toLowerCase().match(/(\d+(?:[.,]\d+)?)\s*(ml|cl|dl|l\b|litre|liter)/);
  if(!m)return 0;
  const v=parseFloat(m[1].replace(',','.'));
  if(m[2]==='ml')return v/1000;
  if(m[2]==='cl')return v/100;
  if(m[2]==='dl')return v/10;
  return v; // l / litre / liter
}

  // For solids: use _serving if declared (natural unit like "1 galleta 28g"); fall back to 100g.

// score a result by how well its name matches the query (relevance ranking)
function offScore(name,brand,qn){
  const nn=bfNorm(name||''), bn=bfNorm(brand||''); if(!nn)return -1;
  const words=qn.split(/\s+/).filter(Boolean); let sc=0;
  if(nn===qn) sc+=100;                                   // exact name
  if(nn.startsWith(qn)) sc+=50;                           // name starts with query
  words.forEach(w=>{ if(nn.split(/\s+/).includes(w)) sc+=20;      // whole-word match in name
    else if(nn.includes(w)) sc+=8;                       // substring in name
    if(bn.includes(w)) sc+=4; });                        // match in brand
  // penalize very long names (usually "X con leche y almendras" noise when searching "leche")
  sc-=Math.min(10,Math.max(0,(nn.length-qn.length)/12));
  return sc;
}

function parseNutritionText(txt){
  const per=foodPer();
  // normalize: lowercase + comma-decimal (5,2 -> 5.2) so LatAm labels parse
  const s=(txt||'').toLowerCase().replace(/(\d)[,](\d)/g,'$1.$2');
  const NUM='(\\d+(?:\\.\\d+)?)';
  // first number appearing shortly (≤15 non-digits, incl. newlines) after a label
  const after=labels=>{ const m=s.match(new RegExp('(?:'+labels+')\\D{0,15}?'+NUM,'i')); return m?parseFloat(m[1]):0; };
  // same but also capture the unit, for g<->mg disambiguation
  const afterU=labels=>{ const m=s.match(new RegExp('(?:'+labels+')\\D{0,15}?'+NUM+'\\s*(mcg|µg|mg|kcal|kj|g)?','i')); return m?{v:parseFloat(m[1])||0,u:(m[2]||'').toLowerCase()}:{v:0,u:''}; };
  // kcal: prefer an explicit "NNN kcal" token so we never grab the kJ figure
  const kc=(s.match(new RegExp(NUM+'\\s*kcal','i'))||[])[1];
  per.kcal=kc!=null?parseFloat(kc):after('calor[ií]as?|calories|energ[ií]a|energy');
  per.protein=after('prote[ií]nas?|protein');
  per.carbs=after('hidratos(?:\\s*de\\s*carbono)?|carbohydrates?|carbs|carbo');
  per.fat=after('grasas?(?:\\s*totales)?|l[ií]pidos|fat');
  per.sugar=after('az[úu]cares?|sugars?');
  per.fiber=after('fib(?:ra|er)');
  const g2mg=r=>r.u==='g'?Math.round(r.v*1000):Math.round(r.v);
  per.sodium=g2mg(afterU('sodio|sodium'));
  per.potassium=g2mg(afterU('potasio|potassium'));
  const caf=afterU('cafe[íi]na|caffeine'); per.caffeine=caf.u==='g'?caf.v*1000:caf.v;
  return per;
}

// TRKAsk: decisión reversible o de flujo. o = {title, detail, ok, cancel, danger}
function trkAsk(o,onOk,onCancel){ const danger=!!o.danger;
  const btnOk=danger?'<button class="cancel danger" data-ask="ok">'+escTxt(o.ok||'borrar')+'</button>':'<button class="ok" data-ask="ok">'+escTxt(o.ok||'continuar')+'</button>';
  const m=askLayer('<h3>'+escTxt(o.title||'¿seguro?')+'</h3>'+(o.detail?'<div class="submeta gap u-preline">'+escTxt(o.detail)+'</div>':'')+'<div class="sheetbtns">'+btnOk+'<button class="cancel" data-ask="no">'+escTxt(o.cancel||'cancelar')+'</button></div>',onCancel);
  m.addEventListener('click',ev=>{ const b=ev.target.closest&&ev.target.closest('[data-ask]'); if(!b)return; ev.stopPropagation(); closeAsk();
    if(b.dataset.ask==='ok'){ if(onOk)onOk(); } else if(onCancel)onCancel(); }); }
// TRKHold: lo irreversible se arma sosteniendo 0.9 s ("armando 73 %"); soltar antes cancela. o = {title, detail, verb}
function holdConfirm(o,onOk,onCancel){ const verb=o.verb||'confirmar', idle='mantén para '+verb, D=900;
  const m=askLayer('<h3>'+escTxt(o.title||'¿seguro?')+'</h3>'+(o.detail?'<div class="submeta gap u-preline">'+escTxt(o.detail)+'</div>':'')+'<button type="button" class="hold" aria-label="'+escTxt(idle)+'"><span class="hold-fill"></span><span class="hold-lbl">'+escTxt(idle)+'</span></button><div class="sheetbtns"><button class="cancel" data-ask="no">cancelar</button></div>',onCancel);
  const b=m.querySelector('.hold'), fill=b.querySelector('.hold-fill'), lbl=b.querySelector('.hold-lbl'); let an=null, raf=0;
  const tick=()=>{ if(!an)return; const p=Math.min(1,(an.currentTime||0)/D); lbl.textContent='armando '+Math.round(p*100)+'%'; if(p<1)raf=requestAnimationFrame(tick); };
  const stop=()=>{ cancelAnimationFrame(raf); if(an){ an.cancel(); an=null; lbl.textContent=idle; } };
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); if(an)return; try{ b.setPointerCapture(e.pointerId); }catch(_){}
    const cur=an=fill.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:D,easing:'linear',fill:'forwards'});
    // la promesa (no el evento): se resuelve al terminar y se rechaza si se canceló al soltar
    cur.finished.then(()=>{ if(an!==cur)return; an=null; cancelAnimationFrame(raf); try{ navigator.vibrate&&navigator.vibrate(30); }catch(_){} closeAsk(); onOk(); }).catch(()=>{});
    raf=requestAnimationFrame(tick); });
  ['pointerup','pointercancel'].forEach(t=>b.addEventListener(t,stop));
  m.querySelector('[data-ask="no"]').addEventListener('click',ev=>{ ev.stopPropagation(); stop(); closeAsk(); if(onCancel)onCancel(); }); }

const GLOSS={
  rir:'RIR · repeticiones en reserva: cuántas más te quedaban. 0 = al fallo · F = fallo con media rep extra. Se registra por serie.',
  t:'T · tensión efectiva: estímulo estimado de cada serie por su carga relativa y su cercanía al fallo (las últimas 5 reps pesan más). ~ = con RIR supuesto.',
  cap:'% de capacidad: tu e1RM de hoy contra la sesión equivalente anterior, descontando la fatiga acumulada en la sesión. ▲ más · ▼ menos · ~ comparación de baja confianza.',
  lm:'MEV · mínimo efectivo · MAV · donde más se progresa · MRV · máximo recuperable. Series duras por semana (guía RP): orientan, no son reglas.',
  est:'estimado = ventana de la literatura ajustada a tu dosis (series, fallo, estiramiento) · observado = lo que muestra tu propio historial, desde 6 pares de sesiones.',
  rirmed:'RIR medio de tus series duras con RIR registrado · "% a RIR ≤1" = qué parte fue al fallo o casi.',
  e1rm:'e1RM: el máximo estimado para 1 repetición (Epley + RIR) de tus series de trabajo. Compara días con pesos y reps distintos.'
};
const glossWrap=(t,k)=>'<span data-gloss="'+k+'">'+t+'</span>';
function popClose(){ const g=document.getElementById('gloss'); if(g)g.remove(); window._glossEl=null; }
function trkPop(anchor,text){ popClose(); if(!text)return; const app=document.getElementById('app'); const p=document.createElement('div'); p.className='gloss'; p.id='gloss'; p.setAttribute('role','tooltip'); p.textContent=text; app.appendChild(p);
  const r=anchor.getBoundingClientRect(), fr=app.getBoundingClientRect(); const w=Math.min(300,fr.width-36); p.style.width=w+'px';
  p.style.left=Math.max(18,Math.min(fr.width-18-w,r.left-fr.left+r.width/2-w/2))+'px';
  const below=r.bottom-fr.top+8, ph=p.offsetHeight; p.style.top=(below+ph>fr.height-90?Math.max(8,r.top-fr.top-8-ph):below)+'px'; window._glossEl=anchor; }

// duplicate a whole meal: clones every item with new ids, optional new tag/name, target date (default today)
function openDupMeal(tag){
  const src=curDate(); const items=(db.meals[src]||[]).filter(m=>m.tag===tag); if(!items.length)return;
  const sugg=mealSuggestions().filter(s=>s!==tag);
  openModal(`<h3>duplicar #${escTxt(tag)}</h3>
   <div class="submeta u-mb10">${items.length} alimento${items.length>1?'s':''} · clona la meal completa</div>
   <div class="field"><label>NUEVA MEAL · nombre</label><input id="dm_tag" value="${escTxt(tag)}" placeholder="ej. desayuno"/>
   <div class="chips" id="dm_sugg">${sugg.slice(0,8).map(s=>`<span class="chip" data-act="dmtag" data-v="${escTxt(s)}">${escTxt(s)}</span>`).join('')}</div></div>
   <div class="field"><label>FECHA</label><input id="dm_date" type="date" value="${src}"/></div>
   <div class="sheetbtns"><button class="ok" id="dm_go">⎘ duplicar</button><button class="cancel" data-act="closemodal">cancel</button></div>`);
  document.querySelectorAll('#dm_sugg .chip').forEach(c=>c.onclick=()=>{ const inp=document.getElementById('dm_tag'); inp.value=c.dataset.v; });

// Markdown journal export (legible, para Obsidian/archivo). El JSON sigue siendo el backup máquina; esto es su contraparte humana.
// ponytail: etiquetas del usuario van CRUDAS (sin escTxt) — regla dura "nunca renombrar" + Markdown es texto plano; la única tabla es numérica (//HÁBITOS) → cero riesgo de `|` en texto de usuario.
function buildExportMd(db){
  const L=[]; const P=db.profile||{}; const G=(db.settings&&db.settings.goals)||{};
  const n=v=>{ v=Math.round((+v||0)*10)/10; return (v%1===0)?String(v):v.toFixed(1); }; // ponytail: 1 decimal sin lib
  const fd=d=>d?fmtDate(d):'sin fecha';
  const bw=db.bodyweight||{}; const bwk=Object.keys(bw).sort();
  L.push('# gym//TRK · export · '+fd(todayISO()),'');
  L.push('## //PERFIL');
  if(P.username)L.push('- usuario: '+P.username);
  if(P.since)L.push('- desde: '+P.since);
  if(P.goal)L.push('- objetivo: '+P.goal);
  if(bwk.length)L.push('- peso actual: '+n(bw[bwk[bwk.length-1]])+' kg');
  if(P.age)L.push('- edad: '+P.age);
  if(P.heightCm)L.push('- altura: '+P.heightCm+' cm');
  L.push('');
  const sess=(db.sessions||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  L.push('## //GYM ('+sess.length+' sesiones)','');
  sess.forEach(s=>{
    L.push('### '+fd(s.date)+' · '+(s.dayName||'sesión')+(s.gym?' · '+s.gym:''));
    let vol=0; const stT=sessionTension(s);
    (s.exercises||[]).forEach((e,ei)=>{
      const sets=(e.sets||[]).filter(x=>(x.w||x.r)&&!x._pf); // mismo filtro real que saveSession
      if(!sets.length)return;
      const parts=sets.map(x=>{ const w=effW(x),r=+x.r||0; if(w&&r)vol+=kgLoad(x)*r; const f=String(x.rir==null?'':x.rir).trim().toUpperCase(); return n(w)+(x.unit||'')+'×'+(r||0)+(x.side?' '+x.side:'')+(x.isDrop?' ↓':'')+(f==='F'?' · F':(f!==''?' · RIR'+f:'')); });
      const tx=stT[ei]&&stT[ei].total>0?' · T '+fmtT(stT[ei].total):'';
      L.push('- '+e.name+(e.muscle?' ('+e.muscle+')':'')+' — '+parts.join(' · ')+tx);
    });
    if(vol>0)L.push('  · volumen: '+n(Math.round(vol))+' kg (Σ kg×reps; lbs→kg, placas excluidas)');
    { const t=sessionTensionTotal(s); if(t>0)L.push('  · tensión efectiva: T '+fmtT(t)); }
    L.push('');
  });
  const meals=db.meals||{}; const mdates=Object.keys(meals).filter(d=>(meals[d]||[]).length).sort().reverse();
  L.push('## //NUTRICIÓN ('+mdates.length+' días)','');
  mdates.forEach(d=>{
    L.push('### '+fd(d));
    const t={kcal:0,protein:0,carbs:0,fat:0};
    (meals[d]||[]).forEach(m=>{
      t.kcal+=+m.kcal||0; t.protein+=+m.protein||0; t.carbs+=+m.carbs||0; t.fat+=+m.fat||0;
      L.push('- '+(m.time?m.time+' · ':'')+(m.tag?m.tag+' · ':'')+m.name+(m.qty?' '+m.qty:'')+' — '+Math.round(+m.kcal||0)+'kcal P'+n(m.protein)+' C'+n(m.carbs)+' F'+n(m.fat));
    });
    L.push('**día: '+Math.round(t.kcal)+' kcal · P'+n(t.protein)+' C'+n(t.carbs)+' F'+n(t.fat)+(G.kcal?' · meta '+G.kcal:'')+'**','');
  });
  const sleep=db.sleep||{}, steps=db.steps||{};
  const waterFor=d=>(meals[d]||[]).reduce((a,m)=>a+(+m.water||0),0);
  const hdates=Array.from(new Set([].concat(Object.keys(sleep),Object.keys(bw),Object.keys(steps),Object.keys(meals)))).filter(Boolean).sort().reverse();
  const hrows=hdates.map(d=>{ const w=waterFor(d); return {d,sl:sleep[d]!=null?n(sleepHours(sleep[d]))+'h':'—',pe:bw[d]!=null?n(bw[d])+'kg':'—',pa:steps[d]!=null?Math.round(steps[d]):'—',ag:w>0?n(w)+'L':'—',any:(sleep[d]!=null||bw[d]!=null||steps[d]!=null||w>0)}; }).filter(r=>r.any);
  L.push('## //HÁBITOS','');
  if(hrows.length){ L.push('| fecha | sueño | peso | pasos | agua |','| --- | --- | --- | --- | --- |'); hrows.forEach(r=>L.push('| '+fd(r.d)+' | '+r.sl+' | '+r.pe+' | '+r.pa+' | '+r.ag+' |')); L.push(''); }
  else { L.push('// sin datos',''); }
  const stack=(db.stack||[]).filter(x=>!x.archived);
  if(stack.length){
    L.push('## //REGÍMENES ('+stack.length+')','');
    stack.forEach(it=>L.push('- '+it.name+(it.dose?' · '+it.dose+(it.unit?' '+it.unit:''):'')+(it.when&&it.when.length?' · '+it.when.join('/'):'')+(it.category?' ['+it.category+']':'')));
    L.push('');
  }
  return L.join('\n');
}
function exportMarkdown(db){
  if(NATIVE_APP){ nativeShareFile('gymtrk-export-'+todayISO()+'.md',buildExportMd(db)); return; }
  const blob=new Blob([buildExportMd(db)],{type:'text/markdown;charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='gymtrk-export-'+todayISO()+'.md';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// downscale + grayscale + contrast → much better/faster OCR on phone photos
function prepImage(file){ return new Promise(res=>{
  const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{ const max=1600; let{width:w,height:h}=img; const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
    const c=document.createElement('canvas'); c.width=w; c.height=h; const cx=c.getContext('2d'); cx.drawImage(img,0,0,w,h);
    try{ const d=cx.getImageData(0,0,w,h),a=d.data; for(let i=0;i<a.length;i+=4){ let g=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2]; g=(g-128)*1.4+128; g=g<0?0:g>255?255:g; a[i]=a[i+1]=a[i+2]=g; } cx.putImageData(d,0,0); }catch(_){}
    URL.revokeObjectURL(url); res(c); };
  img.onerror=()=>{ URL.revokeObjectURL(url); res(file); };
  img.src=url; }); }

function fileToDataURL(file,maxDim,q){ maxDim=maxDim||1280; q=q||0.82; return new Promise(res=>{
  const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{ let w=img.width,h=img.height; const sc=Math.min(1,maxDim/Math.max(w,h)); w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url); let out=null; try{ out=c.toDataURL('image/jpeg',q); }catch(_){} res(out); };
  img.onerror=()=>{ URL.revokeObjectURL(url); res(null); };
  img.src=url; }); }
